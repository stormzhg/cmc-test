  #   install_hint: "https://docs.docker.com/get-docker/"


# =============================================================================
# CLUSTER COMPONENTS (L2) — checked via Kubernetes API
# =============================================================================
cluster_components:

  kubernetes:
    display_name: "Kubernetes"
    check_id: "VER-010"
    severity: critical
    supported:
      min: "1.28.0"
      max: "1.35.99"
      description: "Officially supported for CMC deployment"
    compatible:
      min: "1.27.0"
      max: "1.35.99"

  cert_manager:
    display_name: "Cert Manager"
    check_id: "VER-012"
    severity: critical
    supported:
      min: "1.14.0"
      max: "1.99.99"
      description: "Required for TLS certificate management in CMC"
    compatible:
      min: "1.14.0"
      max: "1.99.99"

  # ---------------------------------------------------------------------------
  # Service Mesh Components
  # ---------------------------------------------------------------------------
  # Each mesh type has its own entry. The check auto-detects which mesh is
  # installed and validates against the matching entry.

  service_mesh_istio:
    display_name: "Istio Service Mesh"
    check_id: "VER-013"
    severity: critical
    supported:
      min: "1.22.0"
      max: "1.99.99"
      description: "Standard Istio for AWS, GCP, STACKIT deployments"
    compatible:
      min: "1.22.0"
      max: "1.99.99"

  service_mesh_asm:
    display_name: "Azure Service Mesh"
    check_id: "VER-013"
    severity: critical
    supported:
      min: "1.26.0"
      max: "1.99.99"
      description: "Azure managed Istio (ASM)"
    compatible:
      min: "1.26.0"
      max: "1.99.99"

  service_mesh_ossm2:
    display_name: "OpenShift Service Mesh 2"
    check_id: "VER-013"
    severity: critical
    supported:
      min: "2.6.4"
      max: "2.99.99"
      description: "OSSM 2.6+ required for CMC on OpenShift"
    compatible:
      min: "2.6.0"
      max: "2.99.99"

  service_mesh_ossm3:
    display_name: "OpenShift Service Mesh 3"
    check_id: "VER-013"
    severity: critical
    supported:
      min: "1.24.3"
      max: "1.99.99"
      description: "OSSM 3 uses Istio versioning (Sail operator)"
    compatible:
      min: "1.24.0"
      max: "1.99.99"

  service_mesh_consul:
    display_name: "HashiCorp Consul"
    check_id: "VER-013"
    severity: critical
    supported:
      min: "1.7.2"
      max: "1.99.99"
      description: "Consul Enterprise recommended for full capabilities"
    compatible:
      min: "1.7.0"
      max: "1.99.99"

  # Maximum allowed minor version difference between control plane and any node.
  # Kubernetes supports N-2 skew (https://kubernetes.io/releases/version-skew-policy/).
  node_skew:
    max_minor_skew: 2

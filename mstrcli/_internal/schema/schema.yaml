  - name: managed-services
    module: managed_services
    description: "Manage managed services in the cluster"
    subCommands:
      - name: install
        description: "Install managed services"
        function: install
        doubleConfirm: true
        options:
          - name: application
            type: list
            items:
              type: string
            prompt:
              renderer: "{$constants.renderers.managed_services_checkbox}"
              reminder: true
              title: "Please select the managed services to install:"
            required: true
            help: "Managed services to install (multiple selections allowed)"
          - name: custom-namespace
            type: boolean
            required: false
            help: "Whether to use custom namespace"
            prompt:
              renderer: custom_confirm
              conditions:
                notEquals:
                  - "{$options[application]}"
                  - "['istio']"
              title: "Would you prefer to use custom namespaces for managed services?"
          - name: namespace-json
            type: string
            required: false
            help: "A JSON-formatted string containing the service names and namespaces"
            prompt:
              renderer: custom_namespace_input
              pattern: "{$constants.patterns.namespace}"
              conditions:
                equals:
                  - "{$options[custom-namespace]}"
                  - "True"
              # For prompt input, it is required
              required: true
          - name: helm-chart-package-path
            type: string
            required: true
            help: "Directory path to the unzipped StrategyOne package folder containing prometheus and keda helm charts and services.json file"
            prompt:
              renderer: "{$constants.renderers.strategyone_directory_input}"
              title: "Please enter the path to StrategyOne package directory containing helm charts:"
          - name: image-registry
            type: string
            required: true
            help: "Image registry to pull the image from"
            prompt:
              renderer: "{$constants.renderers.image_registry_input}"
              pattern: "{$constants.patterns.image_registry}"
              title: "{$constants.titles.image_registry}"
          - name: image-pull-secret-option
            type: string
            required: true
            help: "Image pull secret option"
            prompt:
              renderer: "{$constants.renderers.selector}"
              title: "{$constants.titles.image_pull_secret_option}"
              choices: 
                - "Create new image pull secret"
                - "Image pull secret not required"
                - "Use existing image pull secret"
          - name: image-server
            type: string
            required: false
            help: "Image server host for image pull secret"
            prompt:
              renderer: "{$constants.renderers.image_registry_input}"
              pattern: "{$constants.patterns.image_registry}"
              title: "Please enter image server host:"
              conditions:
                equals:
                  - "{$options[image-pull-secret-option]}"
                  - "Create new image pull secret"
          - name: username
            type: string
            required: false
            help: "Username for image pull secret"
            prompt:
              renderer: "{$constants.renderers.input}"
              title: "Please enter username for image registry:"
              conditions:
                equals:
                  - "{$options[image-pull-secret-option]}"
                  - "Create new image pull secret"
          - name: password
            type: string
            required: false
            help: "Password for image pull secret"
            prompt:
              renderer: "{$constants.renderers.password_input}"
              title: "Please enter password for image registry:"
              conditions:
                equals:
                  - "{$options[image-pull-secret-option]}"
                  - "Create new image pull secret"
          - name: existing-secret-name
            type: string
            required: false
            help: "Name of existing image pull secret"
            prompt:
              renderer: "{$constants.renderers.existing_image_pull_secret_input}"
              title: "{$constants.titles.existing_secret_name}"
              conditions:
                equals:
                  - "{$options[image-pull-secret-option]}"
                  - "Use existing image pull secret"
          - name: storage-class-name
            type: string
            required: false
            help: "Storage class name for managed services (optional for Prometheus and Keda)"
            prompt:
              renderer: "{$constants.renderers.storage_class_selector}"
              title: "Please enter storage class name for managed services (leave empty to use default):"
          - name: max-shards-per-node
            type: integer
            required: false
            help: "Maximum shards per node for Elasticsearch (optional, default 1000)"
            prompt:
              renderer: "{$constants.renderers.input}"
              title: "Enter maximum shards per Elasticsearch node (leave empty for default 1000):"
              conditions:
                contains:
                  - "{$options[application]}"
                  - "elasticsearch"
          - name: nodes
            type: integer
            required: false
            help: "Number of Elasticsearch nodes (optional, default 3)"
            prompt:
              renderer: "{$constants.renderers.input}"
              title: "Enter number of Elasticsearch nodes (leave empty for default 3):"
              pattern: "^$|^[13579]$|^[1-9]\\d*[13579]$"
              conditions:
                contains:
                  - "{$options[application]}"
                  - "elasticsearch"
      - name: uninstall
        description: "Uninstall managed services"
        function: uninstall
        doubleConfirm: true
        options:
          - name: application
            type: list
            items:
              type: string
            prompt:
              renderer: "{$constants.renderers.managed_services_checkbox}"
              title: "Please select the managed services to uninstall:"
            required: true
            help: "Managed services to uninstall (multiple selections allowed)"
      - name: update
        description: "Update Registry, image pull secret, or Configuration for installed managed services"
        function: update
        doubleConfirm: true
        options:
          - name: application
            type: list
            items:
              type: string
            prompt:
              renderer: "{$constants.renderers.managed_services_checkbox}"
              title: "Please select the managed services to update:"
            required: true
            help: "Managed services to update (multiple selections allowed)"
          - name: update-selections
            type: list
            items:
              type: string

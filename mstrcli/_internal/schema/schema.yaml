# Constants section for reusable values
constants:
  patterns:
    namespace: "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$"
    namespace_loose: "^[a-z0-9-]*$"
    version: "^[0-9]{2}\\.[0-9]{2}$"
    helm_operator_package: "^(|.*mstr-operator\\.tgz)$"
    ai_artifacts: "^(|.*AI-Artifacts-[0-9.]+\\.zip)$"
    patch_package: "(?i)^(|.*\\.zip)$"
    security_patch: "^(|.*Patch-[0-9]{2}\\.[0-9]{2}-[0-9.]+\\.zip)$"
    # NOTE: Keep this pattern in sync with IMAGE_REGISTRY_PATTERN in common/constants.py
    image_registry: "^[a-z0-9]([a-z0-9]*(-[a-z0-9]+)*)?(\\.([a-z0-9]([a-z0-9]*(-[a-z0-9]+)*)?))*(:[0-9]+)?(/[a-z0-9._-]+(/[a-z0-9._-]+)*)?$"
    watched_namespaces: "^([a-z0-9]([-a-z0-9]*[a-z0-9])?(,[a-z0-9]([-a-z0-9]*[a-z0-9])?)*)?$"
  
  defaults:
    namespace: "mstr-operator"
    tls_secret_name: "mstr-tls-secret"
    service_type: "LoadBalancer"
    expose_option: "Expose GUI (GUI only external access)"
  
  renderers:
    namespace_input: "namespace_input"
    namespace_for_install_input: "namespace_for_install_input"
    namespace_for_consul: "namespace_for_consul"
    image_registry_input: "image_registry_input"
    file_path_input: "file_path_input"
    yaml_file_input: "yaml_file_input"
    services_json_input: "services_json_input"
    input: "input"
    profile_input: "profile_input"
    password_input: "password_input"
    confirm: "confirm"
    selector: "selector"
    expose_selector: "expose_selector"
    directory_path_input: "directory_path_input"
    strategyone_directory_input: "strategyone_directory_input"
    secret_selector: "secret_selector"
    secret_name_input: "secret_name_input"
    secret_data_input: "secret_data_input"
    update_secret_data_input: "update_secret_data_input"
    secret_type_selector: "secret_type_selector"
    managed_services_checkbox: "managed_services_checkbox"
    managed_services_update_checkbox: "managed_services_update_checkbox"
    ns_in_cr_file_getter: "ns_in_cr_file_getter"
    image_pull_secrets_checkbox: "image_pull_secrets_checkbox"
    image_pull_secret_option_selector: "image_pull_secret_option_selector"
    existing_secret_name_input: "input"
    existing_image_pull_secret_input: "existing_image_pull_secret_input"
    validation_secret_selector: "validation_secret_selector"
    storage_class_selector: "storage_class_selector"
    storage_class_validation_selector: "storage_class_validation_selector"
    static_pv_selector: "static_pv_selector"
    version_input: "version_input"
    profile_update_confirm: "profile_update_confirm"
    issuer_selector: "issuer_selector"
    cert_duration_input: "cert_duration_input"
    update_options_checkbox: "update_options_checkbox"
    web_layer_variant_selector: "web_layer_variant_selector"
    network_diagnose_selector: "network_diagnose_selector"
    default_value: "default_value"
  
  titles:
    namespace_install: "Please enter the namespace to install:"
    namespace_consul: "Your cluster uses Consul as the service mesh. Please enter the namespace where Consul is installed"
    namespace_upgrade: "Please enter the namespace to upgrade:"
    namespace_update: "Please enter the namespace of the installed management service:"
    namespace_expose: "Please enter the namespace to expose:"
    namespace_unexpose: "Please enter the namespace to unexpose:"
    namespace_secret: "Please enter the namespace for the secret"
    namespace_environment: "Please enter the namespace which your environment is in"
    namespace_ai_import: "Please enter the namespace to import AI artifact:"
    namespace_security_patch: "Please enter the namespace to import the patch:"
    namespace_uninstall: "Please enter the namespace to uninstall:"
    namespace_network_diagnose: "Please enter the namespace the management service runs in:"
    image_registry: "Please enter the image registry:"
    image_registry_new: "Please enter the new image registry (leave empty to keep current):"
    cert_file_path: "Please input your certificate file path:"
    cert_key_path: "Please input your certificate key file path:"
    helm_package_path: "Please input the helm package path (Keep empty to download from CMC portal):"
    tls_secret_name: "Please input a secret name to store the cert:"
    self_signed_cert: "Would you prefer to use certificates issued by Kubernetes cert-manager for API and GUI?"
    issuer_name: "Please select issuer for Strategy Services:"
    service_type: "Please select the type of service:"
    expose_service: "Please select the service you want to expose:"
    secret_name: "Please enter the name of the secret"
    cr_file_path: "Please enter the file name of custom resource to validate"
    cr_namespace: "Please enter the namespace which you want your environment to be in"
    profile_update_confirm: "A new profile has been detected. Do you want to update the profile?"
    image_pull_secret_option: "Please select an image pull secret option:"
    existing_secret_name: "Please enter the name of the existing image pull secret:"
    watched_namespaces: "Please enter the namespace(s) for management service to monitor (Keep empty to monitor all namespaces. Format: ns1,ns2,ns3):"
    update_options: "Which fields would you like to update?"

commands:
  - name: login
    module: login
    description: "Login to the portal server"
    options:
      - name: profile
        type: string
        prompt:
          renderer: "{$constants.renderers.profile_input}"
          title: "Please paste your profile here\n"
        required: true
        help: "Login profile"
    function: login

  - name: version
    module: version
    description: "Show version information"
    function: version

  - name: download
    module: download
    description: "Download the artifact resources"
    function: download
    options:
      - name: platform-type
        short: p
        type: string
        required: false
        help: "Platform type: linux, windows, macos"
        prompt:
          renderer: "{$constants.renderers.selector}"
          title: "Select platform:"
          choices: ["linux", "windows", "macos"]
      - name: version
        type: string
        required: false
        help: "Release version to download (keep empty for the latest release)"
        prompt:
          conditions:
            equals:
              - "True"
              - "False"
      - name: print-url
        type: boolean
        required: false
        help: "Print the presigned download URL instead of downloading the artifact"
        prompt:
          conditions:
            equals:
              - "True"
              - "False"

  - name: mgmt-svc
    module: mgmt_svc
    description: "Operate management service"
    subCommands:
      - name: privilege-check
        description: "Check Kubernetes user privileges"
        function: privilege_check
        doubleConfirm: false
        options: []
      - name: install
        description: "Install the management service"
        function: install
        doubleConfirm: true
        options:
          - name: namespace
            short: n
            type: string
            required: false
            default: "{$constants.defaults.namespace}"
            help: "Namespace to install"
            prompt:
              renderer: "{$constants.renderers.namespace_for_install_input}"
              pattern: "{$constants.patterns.namespace}"
              title: "{$constants.titles.namespace_install}"
          - name: image-pull-secrets
            type: list
            items:
              type: string
            required: false
            help: "Image pull secrets to pull the image"
            prompt:
              renderer: "{$constants.renderers.image_pull_secrets_checkbox}"
          - name: image-registry
            type: string
            required: true
            help: "Image registry to pull the image from"
            prompt:
              renderer: "{$constants.renderers.image_registry_input}"
              pattern: "{$constants.patterns.image_registry}"
              title: "{$constants.titles.image_registry}"
          - name: storage-class
            type: string
            required: false
            help: "Storage class to use"
            prompt:
              renderer: "{$constants.renderers.storage_class_selector}"
          - name: pv-name
            type: string
            help: "Persistent volume name to use. Keep empty to use dynamic volume provisioning"
            prompt:
              renderer: "{$constants.renderers.input}"
              title: "Please enter persistent volume name, keep empty if you need dynamic volume provisioning:"
          - name: self-signed-cert
            type: boolean
            help: "Whether to use self-signed certificate"
            prompt:
              renderer: "{$constants.renderers.confirm}"
              title: "{$constants.titles.self_signed_cert}"
          - name: tls-secret-name
            type: string
            required: false
            help: "Secret name to use"
            prompt:
              renderer: "{$constants.renderers.input}"
              pattern: "{$constants.patterns.namespace}"
              conditions:
                equals:
                  - "{$options[self-signed-cert]}"
                  - "False"
              title: "{$constants.titles.tls_secret_name}"
              default: "{$constants.defaults.tls_secret_name}"
              # For prompt input, it is required
              required: true
          - name: tls-cert
            type: string
            required: false
            help: "TLS cert to use, please provide the cert file path"
            prompt:
              renderer: "{$constants.renderers.file_path_input}"
              conditions:
                equals:
                  - "{$options[self-signed-cert]}"
                  - "False"
              title: "{$constants.titles.cert_file_path}"
              # For prompt input, it is required
              required: true
          - name: tls-key
            type: string
            required: false
            help: "TLS key to use, please provide the key file path"
            prompt:
              renderer: "{$constants.renderers.file_path_input}"
              conditions:
                equals:
                  - "{$options[self-signed-cert]}"
                  - "False"
              title: "{$constants.titles.cert_key_path}"
              # For prompt input, it is required
              required: true
          - name: issuer
            type: string
            required: false
            help: "The issuer to use"
            prompt:
              renderer: "{$constants.renderers.issuer_selector}"
              title: "{$constants.titles.issuer_name}"
              required: true
          - name: issuer-type
            type: string
            required: false
            help: "Type of the issuer: ClusterIssuer or Issuer. Required for using custom issuer."
            prompt:
              conditions:
                equals:
                  - "True"
                  - "False"
          - name: cert-duration
            type: string
            required: false
            default: "17520"
            help: "The duration of certificates for management service (in hours)"
            prompt:
              renderer: "{$constants.renderers.cert_duration_input}"
              title: "Input your expected certificate duration (in hours):"
              required: true
          - name: helm-package
            type: string
            required: false
            default: ""
            help: "Use local helm package to install operator. Keep empty to download from CMC portal"
            prompt:
              renderer: "{$constants.renderers.file_path_input}"
              pattern: "{$constants.patterns.helm_operator_package}"
              title: "{$constants.titles.helm_package_path}"
          - name: consul-namespace
            type: string
            required: false
            help: "Namespace where the consul is installed if you use consul as service mesh"
            prompt:
              renderer: "{$constants.renderers.namespace_for_consul}"
              pattern: "{$constants.patterns.namespace}"
              title: "{$constants.titles.namespace_consul}"
              createOnNotExist: false
          - name: watched-namespaces
            type: string
            required: false
            default: ""
            help: "Namespace(s) for management service to monitor (Keep empty to watch all namespaces. Format: ns1,ns2,ns3)"
            prompt:
              renderer: "{$constants.renderers.input}"
              pattern: "{$constants.patterns.watched_namespaces}"
              title: "{$constants.titles.watched_namespaces}"
          - name: web-layer-variant
            type: string
            required: false
            help: "Web Layer variant to install: Standard or New UI (leave empty to keep the current/default selection)"
            prompt:
              renderer: "{$constants.renderers.web_layer_variant_selector}"
              title: "Select Web Layer variant:"
              choices: ["Standard", "New UI"]
      - name: upgrade
        description: "Upgrade the management service"
        function: upgrade
        doubleConfirm: true
        options:
          - name: namespace
            short: n
            type: string
            required: false
            default: "{$constants.defaults.namespace}"
            help: "Namespace to upgrade"
            prompt:
              renderer: "{$constants.renderers.namespace_input}"
              pattern: "{$constants.patterns.namespace}"
              title: "{$constants.titles.namespace_upgrade}"
              createOnNotExist: false
          - name: version
            short: v
            type: string
            required: true
            help: "Version to upgrade to"
            prompt:
              renderer: "{$constants.renderers.version_input}"
              pattern: "{$constants.patterns.version}"
              title: "Please enter the version to upgrade to (latest: 26.10):"
          - name: helm-package
            type: string
            required: false
            default: ""
            help: "Use local helm package to upgrade operator. Keep empty to download from CMC portal"
            prompt:
              renderer: "{$constants.renderers.file_path_input}"
              pattern: "{$constants.patterns.helm_operator_package}"
              title: "{$constants.titles.helm_package_path}"
          - name: image-registry
            type: string
            required: false
            help: "New image registry to pull images from (leave empty to keep current)"
            prompt:
              renderer: "{$constants.renderers.image_registry_input}"
              pattern: "{$constants.patterns.image_registry}"
              title: "{$constants.titles.image_registry_new}"
          - name: image-pull-secrets
            type: list
            items:
              type: string
            required: false
            help: "New image pull secrets to use (leave empty to keep current)"
            prompt:
              renderer: "{$constants.renderers.image_pull_secrets_checkbox}"
          - name: web-layer-variant
            type: string
            required: false
            help: "Switch the Web Layer variant during this upgrade (leave empty to preserve the current variant): Standard or New UI"
            prompt:
              renderer: "{$constants.renderers.web_layer_variant_selector}"
              title: "Select Web Layer variant:"
              choices: ["Standard", "New UI"]

      - name: update
        description: "Update the management service"
        function: update
        doubleConfirm: true
        options:
          - name: namespace
            short: n
            type: string
            required: false
            default: "{$constants.defaults.namespace}"
            help: "Namespace of the installed management service to update"
            prompt:
              renderer: "{$constants.renderers.namespace_input}"
              pattern: "{$constants.patterns.namespace}"
              title: "{$constants.titles.namespace_update}"
              createOnNotExist: false
          - name: update-selections
            type: list
            items:
              type: string
            required: false
            ui_only: true
            help: "Which settings to update (interactive multi-select)"
            prompt:
              renderer: "{$constants.renderers.update_options_checkbox}"
              title: "{$constants.titles.update_options}"
          - name: issuer
            type: string
            required: false
            help: "The issuer to use"
            prompt:
              renderer: "{$constants.renderers.issuer_selector}"
              title: "{$constants.titles.issuer_name}"
              required: false
              selector: true
              conditions:
                contains:
                  - "{$options[update-selections]}"
                  - "Issuer"
          - name: issuer-type
            type: string
            required: false
            default: "Issuer"
            help: "Type of the issuer: ClusterIssuer or Issuer. Required for using custom issuer."
            prompt:
              conditions:
                equals:
                  - "True"
                  - "False"
          - name: update-profile
            type: boolean
            required: false
            help: "Whether to update the profile (only prompted if a new profile is detected)"
            prompt:
              renderer: "{$constants.renderers.profile_update_confirm}"
              title: "{$constants.titles.profile_update_confirm}"
              conditions:
                contains:
                  - "{$options[update-selections]}"
                  - "Profile"
          - name: image-registry
            type: string
            required: false
            help: "New image registry to pull images from"
            prompt:
              renderer: "{$constants.renderers.image_registry_input}"
              pattern: "{$constants.patterns.image_registry}"
              title: "{$constants.titles.image_registry_new}"
              conditions:
                contains:
                  - "{$options[update-selections]}"
                  - "Image registry"
          - name: image-pull-secrets
            type: list
            items:
              type: string
            required: false
            help: "New image pull secrets to use (leave empty to keep current):"
            prompt:
              renderer: "{$constants.renderers.image_pull_secrets_checkbox}"
              conditions:
                contains:
                  - "{$options[update-selections]}"
                  - "Image pull secrets"
          - name: self-signed-cert
            type: boolean
            required: false
            help: "Whether to use self-signed certificate"
            prompt:
              renderer: "{$constants.renderers.confirm}"
              title: "{$constants.titles.self_signed_cert}"
              conditions:
                contains:
                  - "{$options[update-selections]}"
                  - "TLS / Certificate settings"
          - name: tls-secret-name
            type: string
            required: false
            help: "Name of the TLS secret to use (required when not using self-signed cert)"
            prompt:
              renderer: "{$constants.renderers.input}"
              pattern: "{$constants.patterns.namespace}"
              conditions:
                contains:
                  - "{$options[update-selections]}"
                  - "TLS / Certificate settings"
                equals:
                  - "{$options[self-signed-cert]}"
                  - "False"
              title: "{$constants.titles.tls_secret_name}"
              default: "{$constants.defaults.tls_secret_name}"
              required: true
          - name: tls-cert
            type: string
            required: false
            help: "TLS certificate file path (required when not using self-signed cert)"
            prompt:
              renderer: "{$constants.renderers.file_path_input}"
              conditions:
                contains:
                  - "{$options[update-selections]}"
                  - "TLS / Certificate settings"
                equals:
                  - "{$options[self-signed-cert]}"
                  - "False"
              title: "{$constants.titles.cert_file_path}"
              required: true
          - name: tls-key
            type: string
            required: false
            help: "TLS key file path (required when not using self-signed cert)"
            prompt:
              renderer: "{$constants.renderers.file_path_input}"
              conditions:
                contains:
                  - "{$options[update-selections]}"
                  - "TLS / Certificate settings"
                equals:
                  - "{$options[self-signed-cert]}"
                  - "False"
              title: "{$constants.titles.cert_key_path}"
              required: true
          - name: helm-package
            type: string
            required: false
            default: ""
            help: "Use local helm package to update operator. Keep empty to download from CMC portal"
            prompt:
              renderer: "{$constants.renderers.file_path_input}"
              pattern: "{$constants.patterns.helm_operator_package}"
              title: "{$constants.titles.helm_package_path}"
          - name: web-layer-variant
            type: string
            required: false
            help: "Select a Web Layer variant to switch to during this update: Standard or New UI"
            prompt:
              renderer: "{$constants.renderers.web_layer_variant_selector}"
              title: "Select Web Layer variant:"
              choices: ["Standard", "New UI"]
              conditions:
                contains:
                  - "{$options[update-selections]}"
                  - "Web Layer"
          - name: network-diagnose
            type: boolean
            required: false
            help: "Enable or disable network diagnose"
            prompt:
              renderer: "{$constants.renderers.network_diagnose_selector}"
              title: "Select network diagnose setting:"
              choices: ["Enable network diagnose", "Disable network diagnose"]
              conditions:
                contains:
                  - "{$options[update-selections]}"
                  - "Network diagnose"
          - name: host-network
            type: boolean
            required: false
            default: false
            help: "Allow diagnosis containers to use the host network namespace"
            prompt:
              renderer: "{$constants.renderers.confirm}"
              title: "Would you allow diagnosis containers to use the host network namespace?"
              choices: ["No", "Yes"]
              conditions:
                equals:
                  - "{$options[network-diagnose]}"
                  - "True"
          - name: privileged
            type: boolean
            required: false
            default: false
            help: "Allow privileged diagnosis containers or privilege escalation"
            prompt:
              renderer: "{$constants.renderers.confirm}"
              title: "Would you allow privileged containers or containers that can escalate privileges at runtime?"
              choices: ["No", "Yes"]
              conditions:
                equals:
                  - "{$options[network-diagnose]}"
                  - "True"

      - name: patch
        description: "Import patch"
        function: add_patch
        doubleConfirm: true
        options:
          - name: namespace
            short: n
            type: string
            required: false
            default: "{$constants.defaults.namespace}"
            help: "Namespace to import the patch"
            prompt:
              renderer: "{$constants.renderers.namespace_input}"
              pattern: "{$constants.patterns.namespace}"
              title: "{$constants.titles.namespace_security_patch}"
              createOnNotExist: false
          - name: patch-package
            type: string
            required: true
            help: "The path of local package used to import patch."
            prompt:
              renderer: "{$constants.renderers.file_path_input}"
              pattern: "{$constants.patterns.patch_package}"
              title: "Please input the local patch package path:"

      - name: security-patch
        description: "Add security patch"
        interactive: false
        function: add_security_patch
        doubleConfirm: true
        options:
          - name: namespace
            short: n
            type: string
            required: false
            default: "{$constants.defaults.namespace}"
            help: "Namespace to add security patch"
            prompt:
              renderer: "{$constants.renderers.namespace_input}"
              pattern: "{$constants.patterns.namespace}"
              title: "{$constants.titles.namespace_security_patch}"
              createOnNotExist: false
          - name: patch-package
            type: string
            required: true
            default: ""
            help: "The path of local package used to add security patch."
            prompt:
              renderer: "{$constants.renderers.file_path_input}"
              pattern: "{$constants.patterns.security_patch}"
              title: "Please input the local patch package path:"

      - name: uninstall
        description: "Uninstall the management service"
        function: uninstall
        doubleConfirm: true
        reedit: false
        options:
          - name: namespace
            short: n
            type: string
            required: false
            default: "{$constants.defaults.namespace}"
            help: "Namespace to uninstall"
            prompt:
              renderer: "{$constants.renderers.namespace_input}"
              pattern: "{$constants.patterns.namespace}"
              title: "{$constants.titles.namespace_uninstall}"
              createOnNotExist: false
      - name: expose
        description: "Expose the API and GUI for external access"
        function: expose
        doubleConfirm: true
        options:
          - name: namespace
            short: n
            type: string
            required: false
            default: "{$constants.defaults.namespace}"
            help: "Namespace to expose"
            prompt:
              renderer: "{$constants.renderers.namespace_input}"
              pattern: "{$constants.patterns.namespace}"
              title: "{$constants.titles.namespace_expose}"
              createOnNotExist: false
          - name: service-type
            type: string
            prompt:
              renderer: "{$constants.renderers.selector}"
              title: "{$constants.titles.service_type}"
              choices: ["LoadBalancer", "NodePort"]
            required: true
            default: "{$constants.defaults.service_type}"
            help: "Type of service to expose"
          - name: expose-api
            type: boolean
            prompt:
              renderer: "{$constants.renderers.expose_selector}"
              title: "{$constants.titles.expose_service}"
              choices:
                - "Expose GUI (GUI only external access)"
                - "Expose GUI and API (Both GUI and API external access)"
            required: true
            default: "{$constants.defaults.expose_option}"
            help: "Whether to expose API"
      - name: unexpose
        description: "Cancel exposing the API and GUI for external access"
        function: unexpose
        doubleConfirm: true
        options:
          - name: namespace
            short: n
            type: string
            required: false
            default: "{$constants.defaults.namespace}"
            help: "Namespace to unexpose"
            prompt:
              renderer: "{$constants.renderers.namespace_input}"
              pattern: "{$constants.patterns.namespace}"
              title: "{$constants.titles.namespace_unexpose}"
              createOnNotExist: false

      - name: pack-tel-data
        description: "Package telemetry data for manual upload"
        function: compress_files
        doubleConfirm: true
        options:
          - name: directory_path
            type: string
            required: false
            default: ""
            help: "The directory path to save the telemetry data"
            prompt:
              renderer: "{$constants.renderers.directory_path_input}"
              title: "Please input the directory path to save the telemetry data (Keep it empty will save to current path):"

      - name: network-diagnose
        module: network_diagnose
        description: "Manage network diagnose and view its cluster status"
        subCommands:
          - name: status
            description: "Show network diagnose status and version compatibility"
            function: status
            options:
              - name: namespace
                short: n
                type: string
                required: false
                default: "{$constants.defaults.namespace}"
                help: "Namespace of the installed management service"
                prompt:
                  renderer: "{$constants.renderers.namespace_input}"
                  pattern: "{$constants.patterns.namespace}"
                  title: "{$constants.titles.namespace_network_diagnose}"
                  createOnNotExist: false
      - name: update-AI
        description: "Import AI artifacts"
        function: update_ai
        doubleConfirm: true
        options:
          - name: namespace
            short: n
            type: string
            required: false
            default: "{$constants.defaults.namespace}"
            help: "Namespace to import AI artifact"
            prompt:
              renderer: "{$constants.renderers.namespace_input}"
              pattern: "{$constants.patterns.namespace}"

              renderer: "{$constants.renderers.managed_services_update_checkbox}"
              title: "Which fields would you like to update?"
          - name: image-registry
            type: string
            required: false
            help: "New image registry to pull images from (leave empty to keep existing)"
            prompt:
              renderer: "{$constants.renderers.image_registry_input}"
              pattern: "{$constants.patterns.image_registry}"
              title: "{$constants.titles.image_registry}"
              conditions:
                contains:
                  - "{$options[update-selections]}"
                  - "Image registry"
          - name: image-pull-secret-option
            type: string
            required: false
            help: "Image pull secret option"
            prompt:
              renderer: "{$constants.renderers.selector}"
              title: "{$constants.titles.image_pull_secret_option}"
              choices:
                - "Create new image pull secret"
                - "Image pull secret not required"
                - "Use existing image pull secret"
              conditions:
                contains:
                  - "{$options[update-selections]}"
                  - "Image pull secret"
          - name: image-server
            type: string
            required: false
            help: "Image server host for image pull secret"
            prompt:
              renderer: "{$constants.renderers.image_registry_input}"
              pattern: "{$constants.patterns.image_registry}"
              title: "Please enter image server host:"
              conditions:
                equals:
                  - "{$options[image-pull-secret-option]}"
                  - "Create new image pull secret"
          - name: username
            type: string
            required: false
            help: "Username for image pull secret"
            prompt:
              renderer: "{$constants.renderers.input}"
              title: "Please enter username for image registry:"
              conditions:
                equals:
                  - "{$options[image-pull-secret-option]}"
                  - "Create new image pull secret"
          - name: password
            type: string
            required: false
            help: "Password for image pull secret"
            prompt:
              renderer: "{$constants.renderers.password_input}"
              title: "Please enter password for image registry:"
              conditions:
                equals:
                  - "{$options[image-pull-secret-option]}"
                  - "Create new image pull secret"
          - name: existing-secret-name
            type: string
            required: false
            help: "Name of existing image pull secret (used as the default per-namespace; you'll be prompted to override per release if it does not exist in a target namespace)"
            prompt:
              renderer: "{$constants.renderers.existing_image_pull_secret_input}"
              title: "{$constants.titles.existing_secret_name}"
              conditions:
                equals:
                  - "{$options[image-pull-secret-option]}"
                  - "Use existing image pull secret"
          - name: helm-package
            type: string
            required: true
            default: ""
            help: "Directory path to the unzipped StrategyOne package folder (same as used for install). Keep empty to download from CMC portal"
            prompt:
              renderer: "{$constants.renderers.strategyone_directory_input}"
              title: "Please enter the path to StrategyOne package directory containing helm charts:"
          - name: max-shards-per-node
            type: integer
            required: false
            help: "Maximum shards per node for Elasticsearch (optional, default 1000)"
            prompt:
              renderer: "{$constants.renderers.input}"
              title: "Enter maximum shards per Elasticsearch node (leave empty to keep current):"
              conditions:
                contains:
                  - "{$options[update-selections]}"
                  - "Elasticsearch configuration"
          - name: nodes
            type: integer
            required: false
            help: "Number of Elasticsearch nodes (optional, default 3)"
            prompt:
              renderer: "{$constants.renderers.input}"
              title: "Enter number of Elasticsearch nodes (leave empty to keep current):"
              pattern: "^$|^[13579]$|^[1-9]\\d*[13579]$"
              conditions:
                contains:
                  - "{$options[update-selections]}"
                  - "Elasticsearch configuration"

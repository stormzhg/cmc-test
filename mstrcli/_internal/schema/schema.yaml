  - name: validate
    module: validate 
    aliases:
      - v
    description: "Validate custom resource and pre-requisites"
    subCommands:
      - name: custom-resource 
        description: "Validate custom resource"
        function: validate_custom_resource  
        options:
          - name: file
            short: f
            type: string
            required: true
            help: "File name of your custom resource"
            prompt:
              renderer: "{$constants.renderers.file_path_input}"
              title: "{$constants.titles.cr_file_path}"
          - name: namespace
            short: n
            type: string
            required: false
            existedCheck: true
            help: "Namespace which you want your environment to be in"
            prompt:
              renderer: "{$constants.renderers.ns_in_cr_file_getter}"
              pattern: "{$constants.patterns.namespace_loose}"
              title: "{$constants.titles.cr_namespace}"
      
      - name: images
        description: "Validate image accessibility from services.json"
        function: validate_images
        options:
          - name: services-json-path
            type: string
            required: true
            help: "Path to services.json file from StrategyOne package"
            prompt:
              renderer: "{$constants.renderers.services_json_input}"
              title: "Please enter path to services.json file:"
          - name: image-registry
            type: string
            required: true
            help: "Image server URL to test against"
            prompt:
              renderer: "{$constants.renderers.image_registry_input}"
              pattern: "{$constants.patterns.image_registry}"
              title: "Please enter image server URL:"
          - name: image-pull-secret-option
            type: string
            required: true
            help: "Image pull secret option"
            prompt:
              renderer: "{$constants.renderers.selector}"
              title: "How would you like to configure image pull secret?"
              choices:
                - "Image pull secret not required"
                - "Use existing image pull secret"
                - "Create new image pull secret"
          - name: name
            type: string
            required: false
            help: "Name for the new image pull secret (required only if using 'Create new image pull secret' option)"
            prompt:
              renderer: "{$constants.renderers.secret_name_input}"
              pattern: "{$constants.patterns.namespace}"
              title: "Please enter name for the image pull secret:"
              secret_type: "image-pull-secret"
              conditions:
                equals:
                  - "{$options[image-pull-secret-option]}"
                  - "Create new image pull secret"
          - name: data
            type: string
            required: false
            help: "Image pull secret data (server, username, password, email) (required only if using 'Create new image pull secret' option)"
            prompt:
              renderer: "{$constants.renderers.secret_data_input}"
              secret_type: "image-pull-secret"
              conditions:
                equals:
                  - "{$options[image-pull-secret-option]}"
                  - "Create new image pull secret"
          - name: existing-secret-namespace
            type: string
            required: false
            help: "Namespace where the existing secret is located (required only if using 'Use existing image pull secret' option)"
            prompt:
              renderer: "{$constants.renderers.namespace_input}"
              pattern: "{$constants.patterns.namespace}"
              title: "Please enter the namespace where the image pull secret exists:"
              createOnNotExist: false
              conditions:
                equals:
                  - "{$options[image-pull-secret-option]}"
                  - "Use existing image pull secret"
          - name: existing-secret-name
            type: string
            required: false
            help: "Existing secret name (required only if using 'Use existing image pull secret' option)"
            prompt:
              renderer: "{$constants.renderers.validation_secret_selector}"
              title: "Please select an image pull secret:"
              conditions:
                equals:
                  - "{$options[image-pull-secret-option]}"
                  - "Use existing image pull secret"
      
      - name: storage
        description: "Validate storage class and PV/PVC configuration"
        function: validate_storage
        options:
          - name: storage-class-name
            type: string
            required: false
            help: "Storage class name for dynamic provisioning"
            prompt:
              renderer: "{$constants.renderers.storage_class_validation_selector}"
              title: "Please select a storage class:"
          - name: pv-yaml-path
            type: string
            required: false
            help: "Path to PV YAML file (required for static provisioning)"
            prompt:
              renderer: "{$constants.renderers.yaml_file_input}"
              title: "Please enter path to PV YAML file:"
              required: true
              conditions:
                isEmpty:
                  - "{$options[storage-class-name]}"
          - name: pvc-yaml-path
            type: string
            required: false
            help: "Path to PVC YAML file (optional for dynamic, required for static provisioning)"
            prompt:
              renderer: "{$constants.renderers.yaml_file_input}"
              title: "Please enter path to PVC YAML file (optional for dynamic, required for static provisioning):"
          - name: services-json-path
            type: string
            required: true
            help: "Path to services.json file from StrategyOne package"
            prompt:
              renderer: "{$constants.renderers.services_json_input}"
              title: "Please enter path to services.json file:"
          - name: image-registry
            type: string
            required: true
            help: "Image server URL for mstr-utilbox image"
            prompt:
              renderer: "{$constants.renderers.image_registry_input}"
              pattern: "{$constants.patterns.image_registry}"
              title: "Please enter image server URL:"
          - name: image-pull-secret-option
            type: string
            required: true
            help: "Image pull secret option"
            prompt:
              renderer: "{$constants.renderers.selector}"
              title: "How would you like to configure image pull secret?"
              choices:
                - "Image pull secret not required"
                - "Use existing image pull secret"
                - "Create new image pull secret"
          - name: name
            type: string
            required: false
            help: "Name for the new image pull secret (required only if using 'Create new image pull secret' option)"
            prompt:
              renderer: "{$constants.renderers.secret_name_input}"
              pattern: "{$constants.patterns.namespace}"
              title: "Please enter name for the image pull secret:"
              secret_type: "image-pull-secret"
              conditions:
                equals:
                  - "{$options[image-pull-secret-option]}"
                  - "Create new image pull secret"
          - name: data
            type: string
            required: false
            help: "Image pull secret data (server, username, password, email) (required only if using 'Create new image pull secret' option)"
            prompt:
              renderer: "{$constants.renderers.secret_data_input}"
              secret_type: "image-pull-secret"
              conditions:
                equals:
                  - "{$options[image-pull-secret-option]}"
                  - "Create new image pull secret"
          - name: existing-secret-namespace
            type: string
            required: false
            help: "Namespace where the existing secret is located (required only if using 'Use existing image pull secret' option)"
            prompt:
              renderer: "{$constants.renderers.namespace_input}"
              pattern: "{$constants.patterns.namespace}"
              title: "Please enter the namespace where the image pull secret exists:"
              createOnNotExist: false
              conditions:
                equals:
                  - "{$options[image-pull-secret-option]}"
                  - "Use existing image pull secret"
          - name: existing-secret-name
            type: string
            required: false
            help: "Existing secret name (required only if using 'Use existing image pull secret' option)"
            prompt:
              renderer: "{$constants.renderers.validation_secret_selector}"
              title: "Please select an image pull secret:"
              conditions:
                equals:
                  - "{$options[image-pull-secret-option]}"
                  - "Use existing image pull secret"

      - name: preflight
        module: preflight
        description: "Run modular validation checks: cluster, network, storage, images, TLS, security"
        function: validate_preflight
        options:
          - name: namespace
            short: n
            type: string
            required: false
            default: "mstr-operator"
            help: "Target namespace for validation"
            prompt:
              renderer: "{$constants.renderers.namespace_input}"
              pattern: "{$constants.patterns.namespace}"
              title: "Please enter the target namespace:"
              createOnNotExist: false
          - name: category
            short: c
            type: string
            required: false
            default: "all"
            help: "Validation category: all, cluster, network, database, redis, elasticsearch, storage, images, security, compatibility"
            prompt:
              renderer: "{$constants.renderers.selector}"
              title: "Select validation category:"
              choices:
                - "all"
                - "cluster"
                - "network"
                - "storage"
                - "images"
                - "security"
                - "database"
                - "redis"
                - "elasticsearch"
                - "compatibility"
          - name: check
            type: string
            required: false
            default: ""
            help: "Optional check ID(s) to run (comma-separated), e.g. NET-012 or NET-001,NET-012"
            prompt:
              conditions:
                equals:
                  - "True"
                  - "False"
          - name: platform
            type: string
            required: false
            default: ""
            help: "Cloud platform (auto-detected if empty): aws, azure, gcp, openshift, stackit"
            prompt:
              conditions:
                equals:
                  - "True"
                  - "False"
          - name: config-file
            type: string
            required: false
            default: ""
            help: "Path to preflight config YAML file (see preflight-config.example.yaml)"
            prompt:
              renderer: "file_path_input"
              title: "Enter path to preflight config file — database, Redis, and Elasticsearch connection details are read from this file (press Enter to skip):"
          - name: image-pull-secret-name
            type: string
            required: false
            default: ""
            help: "Docker registry pull secret used to pull the diagnostic validation pod image (registries are auto-extracted from the secret)"
            prompt:
              renderer: "preflight_secret_selector"
              title: "Select a pull secret for the diagnostic validation pod (used to pull the troubleshooting image into the cluster):"
          - name: image-pull-secret-namespace
            type: string
            required: false
            default: ""
            help: "Namespace where the image pull secret exists (defaults to target namespace)"
            prompt:
              conditions:
                equals:
                  - "True"
                  - "False"
          - name: image-registry
            type: string
            required: false
            default: ""
            help: "Optional: specific registry URL to validate (if omitted, all registries in the secret are validated)"
            prompt:
              conditions:
                equals:
                  - "True"
                  - "False"
          - name: storage-class
            type: string
            required: false
            default: ""
            help: "Storage class name to validate"
            prompt:
              renderer: "storage_class_validation_selector"
              title: "Select a storage class to validate:"
              conditions:
                isOneOf:
                  - "{$options[category]}"
                  - "all"
                  - "storage"
          - name: static-pv
            type: boolean
            required: false
            help: "Validate static PersistentVolumes (STR-006) for CMC deployed without dynamic provisioning (e.g. NFS). Combine with --storage-class to filter PVs by class."
            prompt:
              renderer: "static_pv_selector"
              conditions:
                isOneOf:
                  - "{$options[category]}"
                  - "all"
                  - "storage"
          - name: db-host
            type: string
            required: false
            default: ""
            help: "Database host to validate connectivity (set via --db-host or the database section of the preflight config file)"
            prompt:
              conditions:
                equals:
                  - "True"
                  - "False"
          - name: db-secret-name
            type: string
            required: false
            default: ""
            help: "Kubernetes secret containing database credentials (set via --db-secret-name or the database section of the preflight config file)"
            prompt:
              conditions:
                equals:
                  - "True"
                  - "False"
          - name: redis-host
            type: string
            required: false
            default: ""
            help: "Redis host to validate connectivity (set via --redis-host or the redis section of the preflight config file)"
            prompt:
              conditions:
                equals:
                  - "True"
                  - "False"
          - name: redis-secret-name
            type: string
            required: false
            default: ""
            help: "Kubernetes secret containing Redis credentials (set via --redis-secret-name or the redis section of the preflight config file)"
            prompt:
              conditions:
                equals:
                  - "True"
                  - "False"
          - name: elasticsearch-host
            type: string
            required: false
            default: ""
            help: "Elasticsearch host to validate connectivity (set via --elasticsearch-host or the elasticsearch section of the preflight config file)"
            prompt:
              conditions:
                equals:
                  - "True"
                  - "False"
          - name: elasticsearch-secret-name
            type: string
            required: false
            default: ""
            help: "Kubernetes secret containing Elasticsearch/OpenSearch credentials (set via --elasticsearch-secret-name or the elasticsearch section of the preflight config file)"
            prompt:
              conditions:
                equals:
                  - "True"
                  - "False"
          - name: proxy-targets
            type: list
            required: false
            default: ""
            help: "Optional proxy endpoints to validate from inside the cluster (examples: proxy.company.com:8080,https://proxy.company.com:8443)"
            prompt:
              renderer: "input"
              title: "Optional: enter proxy targets to validate (comma-separated host:port or URL, e.g. company.com:8080,https://company.com:8443,company.com press Enter to skip):"
              conditions:
                isOneOf:
                  - "{$options[category]}"
                  - "all"
                  - "network"
          - name: node-ports
            type: list
            required: false
            default: ""
            help: "Optional comma-separated NodePort values and/or ranges to verify are available (example: 30080,30000-30010,30443,30440-30445)"
            prompt:
              renderer: "input"
              title: "Optional: enter NodePort values and/or ranges to check (comma-separated, e.g. 30080,30000-30010,34952, press Enter to skip):"
              conditions:
                isOneOf:
                  - "{$options[category]}"
                  - "all"
                  - "network"
          - name: whitelist-ip-ranges
            type: list
            required: false
            help: "Optional IPs/CIDRs/ranges that must be reachable on TCP/443 (example: 10.0.0.5,10.0.0.0/24,10.0.1.10-10.0.1.20)"
            prompt:
              renderer: "input"
              title: "Optional: enter whitelist IPs/CIDRs/ranges to validate on TCP/443 (comma-separated, press Enter to skip):"
              conditions:
                isOneOf:
                  - "{$options[category]}"
                  - "all"
                  - "network"
          - name: output-format
            type: string
            required: false
            default: "table"
            help: "Output format: table, json, detailed"
            prompt:
              conditions:
                equals:
                  - "True"
                  - "False"
          - name: verbose
            type: boolean
            help: "Show verbose output including debug details"
            prompt:
              conditions:
                equals:
                  - "True"
                  - "False"
          - name: skip-auto-diagnose
            type: boolean
            help: "Skip automatic diagnosis of failed checks"
            prompt:
              conditions:
                equals:
                  - "True"
                  - "False"
          - name: fail-on-fail
            type: boolean
            help: "Exit with code 1 if any check fails (for CI/CD pipelines)"
            prompt:
              conditions:
                equals:
                  - "True"
                  - "False"
          - name: skip-pod-checks
            type: boolean
            help: "Skip checks that require deploying diagnostic pods"
            prompt:
              conditions:
                equals:
                  - "True"
                  - "False"
          - name: permission-level
            type: string
            required: false
            default: ""
            help: "Permission level: local (no cluster), readonly (read-only cluster), full (diagnostic pods + PVC)"
            prompt:
              conditions:
                equals:
                  - "True"
                  - "False"
          - name: show-permissions
            type: boolean
            help: "Show permission levels, required RBAC, and which checks run at each level"
            prompt:
              conditions:
                equals:
                  - "True"
                  - "False"
          - name: generate-rbac
            type: boolean
            help: "Generate minimal RBAC YAML for the specified permission level"
            prompt:
              conditions:
                equals:
                  - "True"
                  - "False"
          - name: diagnostic-image
            type: string
            required: false
            default: ""
            help: "Full diagnostic image reference (overrides services.json resolution, e.g. myregistry.example.com/mstr-troubleshoot:26.05.35)"
            prompt:
              conditions:
                equals:
                  - "True"
                  - "False"
          - name: services-json-path
            type: string
            required: false
            default: ""
            help: "Path to services.json from StrategyOne package (auto-discovered relative to mstrcli binary if not set)"
            prompt:
              renderer: "preflight_services_json_input"
              title: "Path to services.json (auto-discovered, press Enter to accept or type to change):"
          - name: check-permissions
            type: boolean
            help: "Verify your current RBAC permissions against a permission level and report what you have vs what's missing"
            prompt:
              conditions:
                equals:
                  - "True"
                  - "False"

  - name: environment
    module: environment 
    aliases:
      - env
      - environments
    description: "List environment and status"
    subCommands:
      - name: list 
        description: "List environments on this cluster"
        function: list 
      - name: status 
        description: "Get status of one environment"
        function: status 
        options:
          - name: namespace
            short: n
            type: string
            required: true
            existedCheck: true
            help: "The namespace which your environment is in"
            prompt:
              renderer: "{$constants.renderers.namespace_input}"
              pattern: "{$constants.patterns.namespace_loose}"
              title: "{$constants.titles.namespace_environment}"

  - name: advanced
    module: advanced
    description: "Advanced operations for management service"
    subCommands:
      - name: purge-resources
        description: "Force cleanup of all Strategy resources"
        function: purge_resources
        doubleConfirm: true
        reedit: false

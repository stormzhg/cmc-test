_internal_defaults_do_not_set:
  autoscaleEnabled: true
  autoscaleMin: 1
  autoscaleMax: 5
  autoscaleBehavior: {}
  replicaCount: 1
  rollingMaxSurge: 100%
  rollingMaxUnavailable: 25%
  hub: ''
  tag: ''
  variant: ''
  image: pilot
  traceSampling: 1.0
  resources:
    requests:
      cpu: 500m
      memory: 2048Mi
  seccompProfile: {}
  cni:
    enabled: false
    provider: default
  extraContainerArgs: []
  env: {}
  envVarFrom: []
  taint:
    enabled: false
    namespace: ''
    name: cni.istio.io/not-ready
  affinity: {}
  tolerations: []
  cpu:
    targetAverageUtilization: 80
  memory: {}
  volumeMounts: []
  volumes: []
  initContainers: []
  nodeSelector: {}
  podAnnotations: {}
  serviceAnnotations: {}
  serviceAccountAnnotations: {}
  sidecarInjectorWebhookAnnotations: {}
  topologySpreadConstraints: []
  jwksResolverExtraRootCA: ''
  keepaliveMaxServerConnectionAge: 30m
  deploymentLabels: {}
  deploymentAnnotations: {}
  configMap: true
  podLabels: {}
  ipFamilyPolicy: ''
  ipFamilies: []
  trustedZtunnelNamespace: ''
  trustedZtunnelName: ''
  sidecarInjectorWebhook:
    neverInjectSelector: []
    alwaysInjectSelector: []
    injectedAnnotations: {}
    enableNamespacesByDefault: false
    reinvocationPolicy: Never
    rewriteAppHTTPProbe: true
    templates: {}
    defaultTemplates: []
  istiodRemote:
    enabled: false
    enabledLocalInjectorIstiod: false
    injectionURL: ''
    injectionPath: /inject
    injectionCABundle: ''
  telemetry:
    enabled: true
    v2:
      enabled: true
      prometheus:
        enabled: true
      stackdriver:
        enabled: false
  revision: ''
  revisionTags: []
  ownerName: ''
  meshConfig:
    enablePrometheusMerge: true
  experimental:
    stableValidationPolicy: false
  global:
    istioNamespace: istio-system
    certSigners: []
    defaultPodDisruptionBudget:
      enabled: true
    defaultResources:
      requests:
        cpu: 10m
    hub: registry.istio.io/release
    tag: 1.30.5
    variant: ''
    imagePullPolicy: ''
    imagePullSecrets: []
    istiod:
      enableAnalysis: false
    logAsJson: false
    nativeNftables: false
    logging:
      level: default:info
    networkPolicy:
      enabled: false
    omitSidecarInjectorConfigMap: false
    resourceScope: all
    operatorManageWebhooks: false
    priorityClassName: ''
    proxy:
      image: proxyv2
      autoInject: enabled
      clusterDomain: cluster.local
      componentLogLevel: misc:error
      excludeInboundPorts: ''
      includeInboundPorts: '*'
      includeIPRanges: '*'
      excludeIPRanges: ''
      includeOutboundPorts: ''
      excludeOutboundPorts: ''
      logLevel: warning
      outlierLogPath: ''
      privileged: false
      seccompProfile: {}
      readinessFailureThreshold: 4
      readinessInitialDelaySeconds: 0
      readinessPeriodSeconds: 15
      startupProbe:
        enabled: true
        failureThreshold: 600
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 2000m
          memory: 1024Mi
      statusPort: 15020
      tracer: none
    proxy_init:
      image: proxyv2
      forceApplyIptables: false
    remotePilotAddress: ''
    caAddress: ''
    externalIstiod: false
    configCluster: false
    configValidation: true
    meshID: ''
    meshNetworks: {}
    mountMtlsCerts: false
    multiCluster:
      clusterName: ''
    network: ''
    pilotCertProvider: istiod
    sds:
      token:
        aud: istio-ca
    sts:
      servicePort: 0
    caName: ''
    waypoint:
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: '2'
          memory: 1Gi
      affinity: {}
      topologySpreadConstraints: []
      nodeSelector: {}
      tolerations: []
  base:
    enableIstioConfigCRDs: true
  gateways:
    securityContext: {}
    seccompProfile: {}
  gatewayClasses: {}
  pdb:
    minAvailable: 1
    unhealthyPodEvictionPolicy: ''
pilot:
  autoscaleMin: 2
  resources:
    requests:
      cpu: 500m
      memory: 2048Mi
    limits:
      cpu: 1000m
      memory: 4096Mi
  seccompProfile:
    type: RuntimeDefault
env:
  PILOT_ENABLE_PERSISTENT_SESSION_FILTER: true
  ENABLE_NATIVE_SIDECARS: true
meshConfig:
  accessLogFile: /dev/stdout
  discoverySelectors:
  - matchLabels:
      istio-injection: enabled
  - matchExpressions:
    - key: kubernetes.io/metadata.name
      operator: In
      values:
      - istio-system
global:
  tag: 1.30.5
  proxy:
    seccompProfile:
      type: RuntimeDefault
gateways:
  securityContext:
    seccompProfile:
      type: RuntimeDefault

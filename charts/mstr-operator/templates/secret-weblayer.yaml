{{- if .Values.weblayer.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: mstr-web-layer-secret
type: Opaque
data:
  # if there is existing secret key, no need to generate a new one
  # retrieve the secret data using lookup function and when not exists, return an empty dictionary / map as result
  {{- $secretObj := (lookup "v1" "Secret" .Release.Namespace  "mstr-web-layer-secret") | default dict }}
  {{- $secretData := (get $secretObj "data") | default dict }}
  {{- $signKey := (get $secretData "secretKey") | default (randAlphaNum 64 | b64enc) }} # generate a high-entropy 64-character alphanumeric string
  secretKey: {{ $signKey | quote }}
{{- end }}
{{- if .Values.apilayer.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: mstr-api-layer-secret
type: Opaque
data:
  # if there is existing api key, no need to generate a new one
  # retrieve the secret data using lookup function and when not exists, return an empty dictionary / map as result
  {{- $secretObj := (lookup "v1" "Secret" .Release.Namespace  "mstr-api-layer-secret") | default dict }}
  {{- $secretData := (get $secretObj "data") | default dict }}
  {{- $apiKeys := (get $secretData "apiKeys") | default "" }} # base64 encoded json string of key-id: api-key
  {{- $apiKeysJson := "" }}
  {{- if ne $apiKeys "" }}
    {{- $apiKeysJson = $apiKeys | b64dec }} # decode apiKeys
  {{- end }}
  {{- $apiKeysDict := dict }}
  {{- if ne $apiKeysJson "" }}
    {{- $apiKeysDict = $apiKeysJson | fromJson | default dict }} # parse decoded apiKeys into dict
  {{- end }}
  {{- $numExistingApiKeys := len $apiKeysDict }}
  # generate new api keys, if needed
  {{- range untilStep $numExistingApiKeys 1 1 }} # currently only support 1 api key
    {{- $newKeyId := printf "key-%s" (randAlphaNum 16 | lower) }} # e.g., key-lcwi1xwyb5levt86
    {{- $newApiKey := uuidv4 }} # e.g., 7641158b-0887-4eb0-9b04-9cd820226d78
    {{- set $apiKeysDict $newKeyId $newApiKey }}
  {{- end }}
  apiKeys: {{ $apiKeysDict | toJson | b64enc }}
{{- end }}

{{- if .Values.apilayer.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: mstr-cmc-accounts
  labels:
    app.kubernetes.io/managed-by: mstr-operator
type: Opaque
data:
  # preserve existing accounts on upgrade
  {{- $secretObj := (lookup "v1" "Secret" .Release.Namespace "mstr-cmc-accounts") | default dict }}
  {{- $secretData := (get $secretObj "data") | default dict }}
  {{- $existing := (get $secretData "accounts") | default "" }}
  {{- if ne $existing "" }}
  accounts: {{ $existing }}
  {{- else }}
  accounts: {{ `{"version":2,"accounts":{}}` | b64enc }}
  {{- end }}
{{- end }}

apiVersion: v1
kind: Secret
metadata:
  name: pkcs12-pass
type: Opaque
data:
  # retrieve the secret data using lookup function and when not exists, return an empty dictionary / map as result
  {{- $secretObj := (lookup "v1" "Secret" .Release.Namespace  "pkcs12-pass") | default dict }}
  {{- $secretData := (get $secretObj "data") | default dict }}
  {{- $pkcs12Pass := (get $secretData "password") | default (include "common.generateRandomPassword" . | b64enc) }}
  password: {{ $pkcs12Pass | quote }}
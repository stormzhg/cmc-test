apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: internal-http-external-https
spec:
  podSelector:
    matchLabels:
      app: api-layer
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {} # all pods in the namespace
      ports:
        - protocol: TCP
          port: {{ .Values.apilayer.container.ports.http }}
    - from: [] # all sources
      ports:
        - protocol: TCP
          port: {{ .Values.apilayer.container.ports.https }}
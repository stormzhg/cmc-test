apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: mstr-operator-clusterrolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: mstr-operator-role
subjects:
- kind: ServiceAccount
  name: mstr-operator-webhook
  namespace: {{ .Release.Namespace }}
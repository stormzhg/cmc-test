apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    cert-manager.io/inject-ca-from: '{{ .Release.Namespace }}/mstr-operator-cert'
  name: mstrenvironments.cloud.microstrategy.com
spec:
  conversion:
    strategy: Webhook
    webhook:
      clientConfig:
        service:
          name: mstr-operator-webhook
          namespace: '{{ .Release.Namespace }}'
          path: /crdconvert
          port: {{ .Values.operator.port }}
      conversionReviewVersions:
      - v1
      - v1beta1
  group: cloud.microstrategy.com
  names:
    kind: MstrEnvironment
    plural: mstrenvironments
    shortNames:
    - mstr
    singular: mstrenvironment
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.dnsEntry
      name: DNS_ENTRY
      priority: 1
      type: string
    - jsonPath: .spec.environmentSize
      name: ENVIRONMENT_SIZE
      priority: 1
      type: integer
    - jsonPath: .spec.environmentType
      name: TYPE
      priority: 0
      type: string
    - jsonPath: .spec.ingressController.type
      name: INGRESS_TYPE
      priority: 1
      type: string
    - jsonPath: .spec.microstrategyVersion
      name: MICROSTRATEGY_VERSION
      priority: 0
      type: string
    - jsonPath: .status.actionStatus.message
      name: ACTION_MESSAGE
      priority: 1
      type: string
    - jsonPath: .status.environmentStatus
      name: STATUS
      priority: 0
      type: string
    - jsonPath: .status.errorMessage
      name: MESSAGE
      priority: 0
      type: string
    name: v1
    schema:
      openAPIV3Schema:
        properties:
          spec:
            properties:
              aiConfigSecret:
                description: The secret name of configurations about the AI service
                  for the environment.
                nullable: true
                type: string
              autoBot:
                description: The auto bot configurations for the environment.
                nullable: true
                properties:
                  database:
                    description: AI service metadata configuration
                    nullable: true
                    properties:
                      applicationName:
                        description: 'Application name used in the PostgreSQL connection
                          string: jdbc:postgresql://<host>:<port>/<db>?ApplicationName={applicationName}.'
                        nullable: true
                        type: string
                      enableSsl:
                        description: Enable ssl for the database connection.
                        nullable: true
                        type: boolean
                      host:
                        description: Database host.
                        type: string
                      port:
                        default: 5432
                        description: Database port.
                        nullable: true
                        type: integer
                      secretName:
                        description: Kubernetes secret for DB username, password and
                          certificate.
                        type: string
                      serverName:
                        description: Database server name for certificate validation.
                          Required when using GCP, the format is {project}:{db instance
                          name}.
                        nullable: true
                        type: string
                      validateServerCertificate:
                        description: Enable validation of the server certificate.
                        nullable: true
                        type: boolean
                    required:
                    - host
                    - secretName
                    type: object
                  storageClass:
                    description: the storageclass name for PV
                    nullable: true
                    type: string
                  storageSize:
                    description: The ClickHouse persistent storage size in Gi
                    nullable: true
                    type: integer
                  version:
                    default: '26.10'
                    description: The version of the Strategy auto bot version.
                    nullable: true
                    type: string
                type: object
              autoScaling:
                description: The config to enable or disable auto scaling for the
                  environment.
                nullable: true
                type: boolean
              buildNumber:
                description: The per-build number (e.g., 11.6.0400.0001). When set,
                  imageTags must also be provided. Used as installedBuildNumber in
                  status after a successful install.
                nullable: true
                type: string
              dbPrecheckEnabled:
                default: true
                description: Whether to run the database pre-check (credential and
                  permission validation) when the environment is installed or updated.
                  Defaults to true. Set to false to skip all DB pre-checks for this
                  environment.
                nullable: true
                type: boolean
              dnsEntry:
                description: DNS entry for the ingress.
                type: string
              enableEnterprisePgPod:
                description: The config to allow user to use pg pod in enterprise
                  type
                nullable: true
                type: boolean
              enableIPv6:
                default: false
                description: Enable IPv6 networking. When true, services bind to IPv6
                  instead of IPv4.
                nullable: true
                type: boolean
              enforceNonWildcardHosts:
                description: "The config to enforce that hosts are non\u2011wildcard\
                  \ in the environment."
                nullable: true
                type: boolean
              environmentSize:
                description: The environment memory size for the environment. Each
                  level contains a series of settings that are optimized for different
                  types of workloads. For enterprise type, environmentSize must greater
                  than or equal to 128.
                type: integer
              environmentType:
                description: Environment type. Supported types are sandbox or enterprise.
                  For enterprise type, remoteDatabase and resourceTier are required
                  and resourceTier must be 2.
                enum:
                - enterprise
                - sandbox
                type: string
                x-kubernetes-validations:
                - message: Environment type is immutable.
                  rule: self == oldSelf
              extraDnsEntries:
                description: The extra dns entries when enable multiple domains.
                items:
                  properties:
                    dnsEntry:
                      description: Extra DNS entry for the environment.
                      type: string
                    ingressController:
                      description: The ingress controller type and configurations
                        for the environment.
                      nullable: true
                      properties:
                        cloudLBConfiguration:
                          description: Cloud Load Balancer Configuration.
                          nullable: true
                          properties:
                            gateway:
                              description: Settings for the gateway resource if use
                                consul as the service mesh.
                              nullable: true
                              properties:
                                annotations:
                                  additionalProperties:
                                    type: string
                                  description: The annotations for the gateway resource.
                                  nullable: true
                                  type: object
                                gatewayClassName:
                                  default: consul
                                  description: The gateway class name for the consul
                                    service mesh.
                                  nullable: true
                                  type: string
                                listenerPort:
                                  default: 8443
                                  description: The gateway listener port for the consul
                                    service mesh.
                                  nullable: true
                                  type: integer
                              type: object
                            ingress:
                              description: Settings for the k8s ingress resource if
                                use ingress type LoadBalancer.
                              nullable: true
                              properties:
                                annotations:
                                  additionalProperties:
                                    type: string
                                  description: The annotations for the ingress.
                                  nullable: true
                                  type: object
                                service:
                                  default:
                                    nodePorts:
                                      http: ''
                                    type: NodePort
                                  description: Service settings for the nginx + ingress
                                    mode. Required if type is nginx, ignored if type
                                    is istio.
                                  nullable: true
                                  properties:
                                    annotations:
                                      additionalProperties:
                                        type: string
                                      description: The annotations for the ingress
                                        service.
                                      nullable: true
                                      type: object
                                    nodePorts:
                                      default:
                                        http: ''
                                      description: The node port of the nginx ingress
                                        controller.
                                      nullable: true
                                      properties:
                                        http:
                                          default: ''
                                          description: Node port for the nginx service.
                                          type: string
                                      required:
                                      - http
                                      type: object
                                    type:
                                      default: NodePort
                                      description: The type for the nginx service.
                                      nullable: true
                                      type: string
                                  type: object
                                specOverrides:
                                  description: The spec overrides for the ingress.
                                  nullable: true
                                  properties:
                                    defaultBackend:
                                      properties:
                                        resource:
                                          properties:
                                            apiGroup:
                                              type: string
                                            kind:
                                              type: string
                                            name:
                                              type: string
                                          type: object
                                        service:
                                          properties:
                                            name:
                                              type: string
                                            port:
                                              properties:
                                                name:
                                                  type: string
                                                number:
                                                  type: integer
                                              type: object
                                          type: object
                                      type: object
                                    ingressClassName:
                                      type: string
                                    rules:
                                      items:
                                        properties:
                                          host:
                                            type: string
                                          http:
                                            properties:
                                              paths:
                                                items:
                                                  properties:
                                                    backend:
                                                      properties:
                                                        resource:
                                                          properties:
                                                            apiGroup:
                                                              type: string
                                                            kind:
                                                              type: string
                                                            name:
                                                              type: string
                                                          type: object
                                                        service:
                                                          properties:
                                                            name:
                                                              type: string
                                                            port:
                                                              properties:
                                                                name:
                                                                  type: string
                                                                number:
                                                                  type: integer
                                                              type: object
                                                          type: object
                                                      type: object
                                                    path:
                                                      type: string
                                                    pathType:
                                                      type: string
                                                  type: object
                                                type: array
                                            type: object
                                        type: object
                                      type: array
                                    tls:
                                      items:
                                        properties:
                                          hosts:
                                            items:
                                              type: string
                                            type: array
                                          secretName:
                                            type: string
                                        type: object
                                      type: array
                                  type: object
                              type: object
                            name:
                              description: A unique name for this load balancer (max
                                20 chars, lowercase alphanumeric and hyphens only,
                                must start and end with alphanumeric). Used to generate
                                deterministic resource names.
                              nullable: true
                              pattern: ^[a-z0-9]([a-z0-9-]{0,18}[a-z0-9])?$
                              type: string
                            service:
                              description: Settings for the k8s service resource if
                                use service type LoadBalancer.
                              nullable: true
                              properties:
                                annotations:
                                  additionalProperties:
                                    type: string
                                  description: The annotations for the nginx service.
                                  nullable: true
                                  type: object
                                loadBalancerSourceRanges:
                                  description: The loadBalancerSourceRanges for the
                                    nginx service.
                                  items:
                                    type: string
                                  nullable: true
                                  type: array
                                nodePorts:
                                  default:
                                    http: ''
                                  description: The node port of the nginx ingress
                                    controller.
                                  nullable: true
                                  properties:
                                    http:
                                      default: ''
                                      description: Node port for the nginx service.
                                      type: string
                                  required:
                                  - http
                                  type: object
                                type:
                                  default: LoadBalancer
                                  description: The type for the nginx service.
                                  nullable: true
                                  type: string
                              type: object
                          type: object
                        httpsPort:
                          default: 443
                          description: The public HTTPS ingress port for this extra
                            load balancer. Defaults to 443.
                          maximum: 65535.0
                          minimum: 1.0
                          nullable: true
                          type: integer
                        tlsSecretName:
                          description: TLS secret name for the ingress controller.
                          nullable: true
                          type: string
                      type: object
                  required:
                  - dnsEntry
                  type: object
                nullable: true
                type: array
              hostAliases:
                description: The FQDN to IP mappings.
                items:
                  properties:
                    hostnames:
                      items:
                        type: string
                      type: array
                    ip:
                      type: string
                  type: object
                nullable: true
                type: array
              imagePullSecrets:
                description: Image pull secret for all Strategy components.
                items:
                  type: string
                nullable: true
                type: array
              imageRegistry:
                description: Image registry for all Strategy components.
                type: string
              imageTags:
                additionalProperties:
                  type: string
                description: Custom image tags keyed by service name (e.g., iserver,
                  biweb), overlaid on top of the GA baseline tags. Can be used alone
                  to patch specific service images, or together with buildNumber for
                  a full per-build environment.
                nullable: true
                type: object
              imageType:
                description: 'The base image type: redhat or chainguard'
                enum:
                - chainguard
                - redhat
                nullable: true
                type: string
              ingressController:
                default:
                  cloudLBConfiguration:
                    service:
                      nodePorts:
                        http: ''
                      type: LoadBalancer
                  type: istio
                description: The ingress controller type and configurations for the
                  environment.
                nullable: true
                properties:
                  cloudLBConfiguration:
                    default:
                      service:
                        nodePorts:
                          http: ''
                        type: LoadBalancer
                    description: Cloud Load Balancer Configuration.
                    nullable: true
                    properties:
                      gateway:
                        description: Settings for the gateway resource if use consul
                          as the service mesh.
                        nullable: true
                        properties:
                          annotations:
                            additionalProperties:
                              type: string
                            description: The annotations for the gateway resource.
                            nullable: true
                            type: object
                          gatewayClassName:
                            default: consul
                            description: The gateway class name for the consul service
                              mesh.
                            nullable: true
                            type: string
                          listenerPort:
                            default: 8443
                            description: The gateway listener port for the consul
                              service mesh.
                            nullable: true
                            type: integer
                        type: object
                      ingress:
                        description: Settings for the k8s ingress resource if use
                          ingress type LoadBalancer.
                        nullable: true
                        properties:
                          annotations:
                            additionalProperties:
                              type: string
                            description: The annotations for the ingress.
                            nullable: true
                            type: object
                          service:
                            default:
                              nodePorts:
                                http: ''
                              type: NodePort
                            description: Service settings for the nginx + ingress
                              mode. Required if type is nginx, ignored if type is
                              istio.
                            nullable: true
                            properties:
                              annotations:
                                additionalProperties:
                                  type: string
                                description: The annotations for the ingress service.
                                nullable: true
                                type: object
                              nodePorts:
                                default:
                                  http: ''
                                description: The node port of the nginx ingress controller.
                                nullable: true
                                properties:
                                  http:
                                    default: ''
                                    description: Node port for the nginx service.
                                    type: string
                                required:
                                - http
                                type: object
                              type:
                                default: NodePort
                                description: The type for the nginx service.
                                nullable: true
                                type: string
                            type: object
                          specOverrides:
                            description: The spec overrides for the ingress.
                            nullable: true
                            properties:
                              defaultBackend:
                                properties:
                                  resource:
                                    properties:
                                      apiGroup:
                                        type: string
                                      kind:
                                        type: string
                                      name:
                                        type: string
                                    type: object
                                  service:
                                    properties:
                                      name:
                                        type: string
                                      port:
                                        properties:
                                          name:
                                            type: string
                                          number:
                                            type: integer
                                        type: object
                                    type: object
                                type: object
                              ingressClassName:
                                type: string
                              rules:
                                items:
                                  properties:
                                    host:
                                      type: string
                                    http:
                                      properties:
                                        paths:
                                          items:
                                            properties:
                                              backend:
                                                properties:
                                                  resource:
                                                    properties:
                                                      apiGroup:
                                                        type: string
                                                      kind:
                                                        type: string
                                                      name:
                                                        type: string
                                                    type: object
                                                  service:
                                                    properties:
                                                      name:
                                                        type: string
                                                      port:
                                                        properties:
                                                          name:
                                                            type: string
                                                          number:
                                                            type: integer
                                                        type: object
                                                    type: object
                                                type: object
                                              path:
                                                type: string
                                              pathType:
                                                type: string
                                            type: object
                                          type: array
                                      type: object
                                  type: object
                                type: array
                              tls:
                                items:
                                  properties:
                                    hosts:
                                      items:
                                        type: string
                                      type: array
                                    secretName:
                                      type: string
                                  type: object
                                type: array
                            type: object
                        type: object
                      name:
                        description: A unique name for this load balancer (max 20
                          chars, lowercase alphanumeric and hyphens only, must start
                          and end with alphanumeric). Used to generate deterministic
                          resource names.
                        nullable: true
                        pattern: ^[a-z0-9]([a-z0-9-]{0,18}[a-z0-9])?$
                        type: string
                      service:
                        description: Settings for the k8s service resource if use
                          service type LoadBalancer.
                        nullable: true
                        properties:
                          annotations:
                            additionalProperties:
                              type: string
                            description: The annotations for the nginx service.
                            nullable: true
                            type: object
                          loadBalancerSourceRanges:
                            description: The loadBalancerSourceRanges for the nginx
                              service.
                            items:
                              type: string
                            nullable: true
                            type: array
                          nodePorts:
                            default:
                              http: ''
                            description: The node port of the nginx ingress controller.
                            nullable: true
                            properties:
                              http:
                                default: ''
                                description: Node port for the nginx service.
                                type: string
                            required:
                            - http
                            type: object
                          type:
                            default: LoadBalancer
                            description: The type for the nginx service.
                            nullable: true
                            type: string
                        type: object
                    type: object
                  existingIngressGateway:
                    description: The configuration for the customer's existing Istio
                      Ingress Gateway resource.
                    nullable: true
                    properties:
                      exportTo:
                        description: Namespaces to export to
                        items:
                          type: string
                        nullable: true
                        type: array
                      selector:
                        additionalProperties:
                          type: string
                        description: The label selector to match the customer's existing
                          Istio Ingress Gateway deployment.
                        type: object
                    required:
                    - selector
                    type: object
                  httpsPort:
                    default: 443
                    description: The public HTTPS ingress port for the Strategy environment.
                      Defaults to 443.
                    maximum: 65535.0
                    minimum: 1.0
                    nullable: true
                    type: integer
                  tlsSecretName:
                    description: TLS secret name for the ingress controller.
                    nullable: true
                    type: string
                  type:
                    default: istio
                    description: Use istio as ingress controller.
                    enum:
                    - consul
                    - istio
                    - nginx
                    nullable: true
                    type: string
                    x-kubernetes-validations:
                    - message: The ingressController.name is immutable.
                      rule: self == oldSelf
                type: object
              internalRevision:
                nullable: true
                type: string
              kerberos:
                description: The config for the kerberos
                nullable: true
                properties:
                  configMapName:
                    description: The kerberos configMap name.
                    nullable: true
                    type: string
                type: object
              license:
                default: ''
                description: The license of the Strategy environment.
                nullable: true
                type: string
              licenseSecret:
                description: The license secret name of the Strategy environment.
                  This field has higher priority than the license field.
                nullable: true
                type: string
              loggingSettings:
                description: The logging settings for the environment.
                nullable: true
                properties:
                  certificateSecretName:
                    description: The certificate secret name for the logging.
                    nullable: true
                    type: string
                  credentialsSecretName:
                    description: Logging credential secret name.
                    nullable: true
                    type: string
                  filters:
                    description: Custom Fluent Bit [FILTER] definitions, run in order
                      after the built-in grep/lua filters and before the output. Each
                      entry is the [FILTER] body without the [FILTER] header, like
                      loggingSettings.outputTemplate. Raw text, no credential interpolation.
                    items:
                      properties:
                        name:
                          description: Name of the filter, used for ordering and display.
                            Optional.
                          nullable: true
                          type: string
                        template:
                          description: Fluent Bit [FILTER] body, WITHOUT the [FILTER]
                            header (mirrors loggingSettings.outputTemplate). Each
                            entry renders as its own [FILTER] section; provide the
                            same key lines you would put after [FILTER]. Passed through
                            as-is; a blank template is skipped with a warning and
                            never blocks environment creation.
                          nullable: true
                          type: string
                      type: object
                    nullable: true
                    type: array
                  outputTemplate:
                    description: Logging output template. See https://docs.fluentbit.io/manual/pipeline/outputs.
                    nullable: true
                    type: string
                  sidecarResources:
                    description: Resources setting for the logging container.
                    nullable: true
                    properties:
                      claims:
                        items:
                          properties:
                            name:
                              type: string
                            request:
                              type: string
                          type: object
                        type: array
                      limits:
                        additionalProperties:
                          anyOf:
                          - type: integer
                          - type: string
                          x-kubernetes-int-or-string: true
                        type: object
                      requests:
                        additionalProperties:
                          anyOf:
                          - type: integer
                          - type: string
                          x-kubernetes-int-or-string: true
                        type: object
                    type: object
                    x-kubernetes-validations:
                    - message: Field claims is not supported in resources.
                      rule: '!has(self.claims)'
                  volumeMountEnabled:
                    default: true
                    description: Use Volume Mount approach for logging credentials.
                      When true, credentials are mounted as files instead of environment
                      variables. For new environments, this defaults to true. Existing
                      environments will keep backward compatibility (false) until
                      manually updated.
                    nullable: true
                    type: boolean
                type: object
              managedRedis:
                default: false
                description: Whether using managed Redis cluster.
                nullable: true
                type: boolean
              managedSearchEngine:
                default: false
                description: Whether using managed elastic search.
                nullable: true
                type: boolean
              microstrategyVersion:
                default: '26.10'
                description: The version of the Strategy build.
                nullable: true
                type: string
              multiWebappsConfigMapName:
                description: The configmap name of configurations about multiple webapps.
                nullable: true
                type: string
              networkPolicies:
                default:
                  dnsPort: 53
                description: The configurations about network policies for the environment.
                  The default dnsPort is 53.
                nullable: true
                properties:
                  dnsPort:
                    default: 53
                    description: The port number for DNS server. Default is 53.
                    nullable: true
                    type: integer
                type: object
              nodeSelector:
                additionalProperties:
                  type: string
                description: NodeSelector for all Strategy components.
                nullable: true
                type: object
              persistentVolumeClaimSpecOverrides:
                default:
                  accessModes:
                  - ReadWriteMany
                  resources:
                    requests:
                      storage: 1024Gi
                description: The persistent volume claim spec overrides for the environment.
                  A preset PersistentVolumeClaimSpec using default storage class in
                  cluster will be created if this field is not set. If accessModes
                  is not set, it will be set to ReadWriteMany. If requests.storage
                  is not set, it will be set to 1024Gi.
                nullable: true
                properties:
                  accessModes:
                    items:
                      type: string
                    type: array
                  dataSource:
                    properties:
                      apiGroup:
                        type: string
                      kind:
                        type: string
                      name:
                        type: string
                    type: object
                  dataSourceRef:
                    properties:
                      apiGroup:
                        type: string
                      kind:
                        type: string
                      name:
                        type: string
                      namespace:
                        type: string
                    type: object
                  resources:
                    properties:
                      limits:
                        additionalProperties:
                          anyOf:
                          - type: integer
                          - type: string
                          x-kubernetes-int-or-string: true
                        type: object
                      requests:
                        additionalProperties:
                          anyOf:
                          - type: integer
                          - type: string
                          x-kubernetes-int-or-string: true
                        type: object
                    type: object
                  selector:
                    properties:
                      matchExpressions:
                        items:
                          properties:
                            key:
                              type: string
                            operator:
                              type: string
                            values:
                              items:
                                type: string
                              type: array
                          type: object
                        type: array
                      matchLabels:
                        additionalProperties:
                          type: string
                        type: object
                    type: object
                  storageClassName:
                    type: string
                  volumeAttributesClassName:
                    type: string
                  volumeMode:
                    type: string
                  volumeName:
                    type: string
                type: object
              persistentVolumeSpec:
                description: The persistent volume spec overrides for the environment.
                  No PV will be created by default. We recommend using PVC instead
                  of PV.
                nullable: true
                properties:
                  accessModes:
                    items:
                      type: string
                    type: array
                  awsElasticBlockStore:
                    properties:
                      fsType:
                        type: string
                      partition:
                        type: integer
                      readOnly:
                        type: boolean
                      volumeID:
                        type: string
                    type: object
                  azureDisk:
                    properties:
                      cachingMode:
                        type: string
                      diskName:
                        type: string
                      diskURI:
                        type: string
                      fsType:
                        type: string
                      kind:
                        type: string
                      readOnly:
                        type: boolean
                    type: object
                  azureFile:
                    properties:
                      readOnly:
                        type: boolean
                      secretName:
                        type: string
                      secretNamespace:
                        type: string
                      shareName:
                        type: string
                    type: object
                  capacity:
                    additionalProperties:
                      anyOf:
                      - type: integer
                      - type: string
                      x-kubernetes-int-or-string: true
                    type: object
                  cephfs:
                    properties:
                      monitors:
                        items:
                          type: string
                        type: array
                      path:
                        type: string
                      readOnly:
                        type: boolean
                      secretFile:
                        type: string
                      secretRef:
                        properties:

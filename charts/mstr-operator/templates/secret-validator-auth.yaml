{{- if or .Values.validator.enabled .Values.apilayer.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: mstr-validator-auth
type: Opaque
data:
  {{- $secretObj := (lookup "v1" "Secret" .Release.Namespace "mstr-validator-auth") | default dict }}
  {{- $secretData := (get $secretObj "data") | default dict }}
  {{- $apiKey := (get $secretData "apiKey") | default "" }}
  {{- if eq $apiKey "" }}
  {{- $apiKey = uuidv4 | b64enc }}
  {{- end }}
  apiKey: {{ $apiKey }}
{{- end }}

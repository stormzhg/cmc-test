                x-kubernetes-validations:
                - message: The presetSettings.url is required if preset is s3 gcs
                    and stackit.
                  rule: self.preset == 'image' || has(self.presetSettings) && has(self.presetSettings.url)
              resources:
                description: Resources setting for the refresh job.
                nullable: true

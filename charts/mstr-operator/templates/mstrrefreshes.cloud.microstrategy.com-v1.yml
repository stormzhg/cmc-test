                    type: object
                  preset:
                    default: image
                    description: 'The restore preset to use. Conflict to initContainerTemplate.
                      Warn: preset s3, gcs and stackit require permissions.'
                    enum:
                    - blob
                    - curl
                    - gcs
                    - image
                    - s3
                    - s3_compatible
                    - stackit
                    nullable: true
                    type: string
                  presetSettings:
                    default:
                      filePath: /blankmd.tar.gz
                      image: mstr-md:26.10
                    description: The settings for the restore preset. This is required
                      if the preset is s3, gcs, blob, stackit or curl.
                    nullable: true
                    properties:
                      caCertSecretName:
                        description: Optional. Name of a Kubernetes Secret in the
                          same namespace that contains a custom CA certificate under
                          the key 'ca.crt'. Required only when the S3-compatible endpoint
                          uses a self-signed or private-CA TLS certificate. Leave
                          unset for endpoints with publicly trusted TLS certs.
                        nullable: true
                        type: string
                      endpoint:
                        description: The host base for the S3 compatible bucket
                        nullable: true
                        type: string
                      filePath:
                        description: The mstrbak file path. Required if you want to
                          use a custom image to provide the backup file.
                        nullable: true
                        type: string
                      forcePathStyle:
                        description: Use Path-Style host or Virtual-Hosted Style,
                          default is Path-Style
                        nullable: true
                        type: boolean
                      image:
                        description: Image contains the mstrbak file or is used to
                          download mstrbak file from cloud storage. Required if you
                          want to use a custom image to provide the backup file.
                        nullable: true
                        type: string
                      insecureSkipTlsVerify:
                        description: Optional. When true, TLS certificate verification
                          is skipped when talking to the S3-compatible endpoint. Intended
                          for development or test environments only. Defaults to false.
                        nullable: true
                        type: boolean
                      location:
                        description: 'S3: AWS region. Required for AWS opt-in Regions.
                          This page (https://docs.aws.amazon.com/controltower/latest/userguide/opt-in-region-considerations.html)
                          lists the AWS opt-in Regions.'
                        nullable: true
                        type: string
                      secretName:
                        description: Kubernetes secret name containing Stackit or
                          S3-compatible credentials (accessKey and secretKey).
                        nullable: true
                        type: string
                      url:
                        description: The URL to the S3 or GCS bucket or stackit object
                          storage.
                        nullable: true
                        type: string
                      useHttps:
                        description: Use https host or not, default is use https
                        nullable: true
                        type: boolean
                    type: object
                  restoreAnnotations:
                    additionalProperties:
                      type: string
                    description: The annotations of the service account for the restore
                      job.
                    nullable: true
                    type: object
                  restoreComponents:
                    description: The selected restore components
                    nullable: true
                    properties:
                      database:
                        description: database selectable backup components
                        items:
                          enum:
                          - COLLAB_SERVICE
                          - HISTORY_LIST
                          - INSIGHT_SERVICE
                          - METADATA
                          - PLATFORM_ANALYTICS
                          - STORAGE_SERVICE
                          type: string
                        nullable: true
                        type: array
                      files:
                        description: files selectable backup components
                        items:
                          enum:
                          - caches
                          - cubes
                          - fonts
                          - iserver_images
                          - odbc
                          - status_tracker
                          - usl
                          - webapps
                          type: string
                        nullable: true
                        type: array
                    type: object
                  serviceAccountName:

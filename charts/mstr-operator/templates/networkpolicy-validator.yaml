{{- if .Values.validator.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mstr-validator-api-layer-ingress
spec:
  podSelector:
    matchLabels:
      app: mstr-validator
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: api-layer
      ports:
        - protocol: TCP
          port: 8080
{{- end }}

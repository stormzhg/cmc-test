apiVersion: v1
kind: ConfigMap
metadata:
  name: mstr-operator-config
data:
  name: {{ include "common.resolveClusterName" . }}
  {{- if .Values.telemetry.enabled }}
  server: {{ required "A valid .Values.telemetry.serverUrl entry required!" .Values.telemetry.serverUrl | quote }}
  {{- end }}
  {{- if .Values.global.watchedNamespaces }}
  namespaces: {{ .Values.global.watchedNamespaces | quote }}
  {{- end }}
  

metadata:
  name: mstrenvironment
  annotations:
    cert-manager.io/inject-ca-from: "{{ .Release.Namespace }}/mstr-operator-cert"
spec:
  conversion:
    strategy: Webhook
    webhook:
      conversionReviewVersions: ["v1","v1beta1"]
      clientConfig:
        service:
          namespace: "{{ .Release.Namespace }}"
          name: mstr-operator-webhook
          path: /crdconvert
          port: "{{ .Values.operator.port }}"

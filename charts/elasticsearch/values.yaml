---
clusterName: "elasticsearch"
nodeGroup: "master"

# The service that non master groups will try to connect to when joining the cluster
# This should be set to clusterName + "-" + nodeGroup for your master group
masterService: ""

# Elasticsearch roles that will be applied to this nodeGroup
# These will be set as environment variables. E.g. node.roles=master
# https://www.elastic.co/guide/en/elasticsearch/reference/current/modules-node.html#node-roles
roles:
  - master
  - data
  - data_content
  - data_hot
  - data_warm
  - data_cold
  - ingest
  - ml
  - remote_cluster_client
  - transform

machineLearning:
  enabled: false

replicas:
  min: 3
  max: 3
minimumMasterNodes: 1

esMajorVersion: 9

# Allows you to add any config files in /usr/share/elasticsearch/config/
# such as elasticsearch.yml and log4j2.properties
esConfig: {}
#  elasticsearch.yml: |
#    key:
#      nestedkey: value
#  log4j2.properties: |
#    key = value

createCert: false

security:
  enabled: false
  transport:
    enabled: false
  https:
    enabled: false

protocol: http
httpPort: 9200
transportPort: 9300

esJvmOptions: {}
#  processors.options: |
#    -XX:ActiveProcessorCount=3

# Extra environment variables to append to this nodeGroup
# This will be appended to the current 'env:' key. You can use any of the kubernetes env
# syntax here
extraEnvs: []
#  - name: MY_ENVIRONMENT_VAR
#    value: the_value_goes_here

# Allows you to load environment variables from kubernetes secret or config map
envFrom: []
# - secretRef:
#     name: env-secret
# - configMapRef:
#     name: config-map


# Disable it to use your own elastic-credential Secret.
secret:
  enabled: true
  password: "elastic" # generated randomly if not defined
  transport:
    # ONLY PKCS12 is supported for now
    type: PKCS12
    keystore: 
    keystorePassword: mstr
    keystoreKeyPassword: mstr
    truststore: 
    truststorePassword: mstr

  html:
    keystore:
    truststore: 

# A list of secrets and their paths to mount inside the pod
# This is useful for mounting certificates for security and for mounting
# the X-Pack license
secretMounts: []
#  - name: secret-cert
#    secretNameSuffix: secret
#    items:
#    - key: trans-keystore-cert
#      path: /usr/share/elasticsearch/config/certs/trans-keystore-cert.p12
#      defaultMode: 0755
#    - key: trans-truststore-cert
#      path: /usr/share/elasticsearch/config/certs/trans-truststore-cert.p12
#      defaultMode: 0755

hostAliases: []
#- ip: "127.0.0.1"
#  hostnames:
#  - "foo.local"
#  - "bar.local"

# image for Elasticsearch Service image details
image:
  registry: jfrog.internal.microstrategy.com/mstr-docker-ci-virtual
  repository: elasticsearch-service
  tag: m2021-.-latest
  pullPolicy: IfNotPresent

utilbox:
  image:
    repository: mstr-utilbox
    tag: m2021-.-latest
    pullPolicy: IfNotPresent

podAnnotations: {}
# iam.amazonaws.com/role: es-cluster

# additionals labels
labels: {}

esJavaOpts: "" # example: "-Xmx1g -Xms1g"

resources:
  requests:
    cpu: "500m"
    memory: "4Gi"
  limits:
    cpu: "2000m"
    memory: "8Gi"

initResources: {}
# limits:
#   cpu: "25m"
#   # memory: "128Mi"
# requests:
#   cpu: "25m"
#   memory: "128Mi"

## Init container to adjust the PVC ownership when the storage backend does not honor fsGroup.
## This resolves "permission denied" errors on the Elasticsearch data directory.
## @param volumePermissions.enabled Enable init container that changes the owner and group of the persistent volume mountpoint to runAsUser:fsGroup
## @param volumePermissions.resources Set container requests and limits for different resources like CPU or memory
## @param volumePermissions.containerSecurityContext.enabled Enable init container's Security Context
## @param volumePermissions.containerSecurityContext.runAsUser User ID for the init container (must be 0/root to run chown)
## @param volumePermissions.containerSecurityContext.runAsGroup Group ID for the init container
## @param volumePermissions.containerSecurityContext.runAsNonRoot Set init container's Security Context runAsNonRoot
## @param volumePermissions.containerSecurityContext.privileged Set init container's Security Context privileged
## @param volumePermissions.containerSecurityContext.allowPrivilegeEscalation Set init container's Security Context allowPrivilegeEscalation
## @param volumePermissions.containerSecurityContext.capabilities.drop List of capabilities to be dropped
## @param volumePermissions.containerSecurityContext.capabilities.add List of capabilities to be added
## @param volumePermissions.containerSecurityContext.seccompProfile.type Set init container's Security Context seccomp profile
##
volumePermissions:
  enabled: true
  resources:
    limits:
      cpu: "200m"
      memory: "256Mi"
    requests:
      cpu: "50m"
      memory: "128Mi"
  containerSecurityContext:
    enabled: true
    runAsUser: 0
    runAsGroup: 0
    runAsNonRoot: false
    privileged: false
    allowPrivilegeEscalation: false
    capabilities:
      drop: ["ALL"]
      add: ["CHOWN"]
    seccompProfile:
      type: "RuntimeDefault"

# Bind and publish the primary Kubernetes pod IP. The StatefulSet defines POD_IP
# before network.host, allowing Kubernetes to expand this for IPv4 or IPv6 pods.
networkHost: "$(POD_IP)"

volumeClaimTemplate:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 300Gi

rbac:
  create: false
  serviceAccountAnnotations: {}
  serviceAccountName: ""
  automountToken: true

podSecurityPolicy:
  create: false
  name: ""
  spec:
    privileged: true
    fsGroup:
      rule: RunAsAny
    runAsUser:
      rule: RunAsAny
    seLinux:
      rule: RunAsAny
    supplementalGroups:
      rule: RunAsAny
    volumes:
      - secret
      - configMap
      - persistentVolumeClaim
      - emptyDir

persistence:
  enabled: true
  labels:
    # Add default labels for the volumeClaimTemplate of the StatefulSet
    enabled: false
  annotations: {}

# Node-local storage configuration for environments where NFS PV has performance issues
# When enabled, Elasticsearch data is stored on node-local disk (local PV) for better I/O performance
# Data is synchronized with NFS PV on pod startup (restore) and shutdown (backup)
nodeLocalStorage:
  enabled: false
  # Size of the node-local PersistentVolume for each pod
  storageSize: "100Gi"
  # Enable backup to NFS PV on pod shutdown and restore from NFS PV on pod startup
  # When false, node-local storage is used without data synchronization to NFS
  backupRestoreEnabled: false
  # Path inside the container where NFS PV will be mounted for backup/restore
  backupPath: "/backup-data"
  # Storage class name 
  storageClassName: local-path

extraVolumes: []
# - name: extras
#   emptyDir: {}

extraVolumeMounts: []
# - name: extras
#   mountPath: /usr/share/extras
#   readOnly: true

extraContainers: []
# - name: do-something
#   image: busybox
#   command: ['do', 'something']

extraInitContainers: []
# - name: do-something
#   image: busybox
#   command: ['do', 'something']

# This is the PriorityClass settings as defined in
# https://kubernetes.io/docs/concepts/configuration/pod-priority-preemption/#priorityclass
priorityClassName: ""

# By default this will make sure two pods don't end up on the same node
# Changing this to a region would allow you to spread pods across regions
antiAffinityTopologyKey: "kubernetes.io/hostname"

# Hard means that by default pods will only be scheduled if there are enough nodes for them
# and that they will never end up on the same node. Setting this to soft will do this "best effort"
# We will use "soft" affinity setting since we may not have enough nodes to deploy 3 replicas
# on individual 3 nodes.
antiAffinity: "soft"

# This is the node affinity settings as defined in
# https://kubernetes.io/docs/concepts/configuration/assign-pod-node/#node-affinity-beta-feature
nodeAffinity: {}

# The default is to deploy all pods serially. By setting this to parallel all pods are started at
# the same time when bootstrapping the cluster
podManagementPolicy: "Parallel"

# The environment variables injected by service links are not used, but can lead to slow Elasticsearch boot times when
# there are many services in the current namespace.
# If you experience slow pod startups you probably want to set this to `false`.
enableServiceLinks: true

service:
  enabled: true
  labels: {}
  labelsHeadless: {}
  type: ClusterIP
  # Consider that all endpoints are considered "ready" even if the Pods themselves are not
  # https://kubernetes.io/docs/reference/kubernetes-api/service-resources/service-v1/#ServiceSpec
  publishNotReadyAddresses: false
  nodePort: ""
  annotations: {}
  httpPortName: http
  transportPortName: transport
  loadBalancerIP: ""
  loadBalancerSourceRanges: []
  externalTrafficPolicy: ""

updateStrategy: RollingUpdate

# This is the max unavailable setting for the pod disruption budget
# The default value of 1 will make sure that kubernetes won't allow more than 1
# of your pods to be unavailable during maintenance
maxUnavailable: 1

podSecurityContext:
  fsGroup: 1000
  runAsUser: 1000
  runAsGroup: 1000
  # 1000 - mstr user
  # 999 - calico dikastes user
  # 1337 - istio user
  supplementalGroups:
    - 1000
    - 999
    - 1337
  runAsNonRoot: true

securityContext:
  allowPrivilegeEscalation: false
  runAsUser: 1000
  runAsGroup: 1000
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault
  capabilities:
    drop:
      - ALL

# How long to wait for elasticsearch to stop gracefully
terminationGracePeriod: 180

# Enlarge the vm.max_map_count setting to 262144, otherwise, ES could not be startup
sysctlInitContainer:
  enabled: false

sysctlVmMaxMapCount: 262144

readinessProbe:
  failureThreshold: 3
  initialDelaySeconds: 10
  periodSeconds: 10
  successThreshold: 3
  timeoutSeconds: 5

# https://www.elastic.co/guide/en/elasticsearch/reference/current/cluster-health.html#request-params wait_for_status
clusterHealthCheckParams: "wait_for_status=yellow&timeout=1s"

## Use an alternate scheduler.
## ref: https://kubernetes.io/docs/tasks/administer-cluster/configure-multiple-schedulers/
##
schedulerName: ""

imagePullSecrets: []
nodeSelector: {}
tolerations: []

# Enabling this will publicly expose your Elasticsearch instance.
# Only enable this if you have security enabled on your cluster
ingress:
  enabled: false
  annotations: {}
  # kubernetes.io/ingress.class: nginx
  # kubernetes.io/tls-acme: "true"
  className: "nginx"
  pathtype: Prefix
  hosts:
    - host: elasticsearch.example.com
      paths:
        - path: "/"
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

nameOverride: ""
fullnameOverride: ""
healthNameOverride: ""

lifecycle: {}
# preStop:
#   exec:
#     command: ["/bin/sh", "-c", "echo Hello from the postStart handler > /usr/share/message"]
# postStart:
#   exec:
#     command:
#       - bash

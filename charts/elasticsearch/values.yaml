#         while [[ "$(curl -s -o /dev/null -w '%{http_code}\n' $ES_URL)" != "200" ]]; do sleep 1; done
#         curl -XPUT "$ES_URL/_template/$TEMPLATE_NAME" -H 'Content-Type: application/json' -d'{"index_patterns":['\""$INDEX_PATTERN"\"'],"settings":{"number_of_shards":'$SHARD_COUNT',"number_of_replicas":'$REPLICA_COUNT'}}'

keystore: []

networkPolicy:
  ## Enable creation of NetworkPolicy resources. Only Ingress traffic is filtered for now.
  ## In order for a Pod to access Elasticsearch, it needs to have the following label:
  ## {{ template "uname" . }}-client: "true"
  ## Example for default configuration to access HTTP port:
  ## elasticsearch-master-http-client: "true"
  ## Example for default configuration to access transport port:
  ## elasticsearch-master-transport-client: "true"

  http:
    enabled: true
    explicitNamespacesSelector: {}
    additionalRules:
      - podSelector:
          matchLabels:
            service: "search-service"
        namespaceSelector: {}
      - podSelector:
          matchLabels:
            app: "mstr-cleanup"
        namespaceSelector: {}
      - podSelector:
          matchLabels:
            app: "mstr-validator"
        namespaceSelector: {}
    ## if explicitNamespacesSelector is not set or set to {}, only client Pods being in the networkPolicy's namespace
    ## and matching all criteria can reach the DB.
    ## But sometimes, we want the Pods to be accessible to clients from other namespaces, in this case, we can use this
    ## parameter to select these namespaces
    ##
    # explicitNamespacesSelector:
    #   # Accept from namespaces with all those different rules (only from whitelisted Pods)
    #   matchLabels:
    #     role: frontend
    #   matchExpressions:
    #     - {key: role, operator: In, values: [frontend]}

    ## Additional NetworkPolicy Ingress "from" rules to set. Note that all rules are OR-ed.
    ##
    # additionalRules:
    #   - podSelector:
    #       matchLabels:
    #         role: frontend
    #   - podSelector:
    #       matchExpressions:
    #         - key: role
    #           operator: In
    #           values:
    #             - frontend

  transport:
    ## Note that all Elasticsearch Pods can talk to themselves using transport port even if enabled.
    enabled: true
    explicitNamespacesSelector: {}
    additionalRules: []
    # explicitNamespacesSelector:
    #   matchLabels:
    #     role: frontend
    #   matchExpressions:
    #     - {key: role, operator: In, values: [frontend]}
    # additionalRules:
    #   - podSelector:
    #       matchLabels:
    #         role: frontend
    #   - podSelector:
    #       matchExpressions:
    #         - key: role
    #           operator: In
    #           values:
    #             - frontend

mount:
  pvcName: "localstoragevolume"

tests:
  enabled: true

istioEnabled: true

# Set to true ONLY for `helm upgrade` of an already-bootstrapped cluster: it omits
# cluster.initial_master_nodes so the existing cluster state drives master election.
# Must be false for any fresh install — otherwise the new cluster can never bootstrap.
upgrading: false

consul:
  mutualTLSMode: "strict"
  localRequestTimeoutMs: 4000000

virtualService:
  enabled: false
  gateway: istio-system/environment-gateway
  hosts:
    - "elasticsearch.example.com"

## @param openshiftSccClusterRoleName Existing OpenShift ClusterRole that grants use of an SCC allowing the volumePermissions init container to run as root and add CHOWN.
openshiftSccClusterRoleName: "mstr-operator-scc-use-clusterrole"

useSeLinuxOptionTypeSpcT: false

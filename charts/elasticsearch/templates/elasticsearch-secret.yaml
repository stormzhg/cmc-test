{{- if .Values.secret.enabled -}}
{{- $passwordValue := (randAlphaNum 16) | b64enc | quote }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ template "elasticsearch.uname" . }}-credentials
  labels:
    heritage: {{ .Release.Service | quote }}
    release: {{ .Release.Name | quote }}
    chart: "{{ .Chart.Name }}"
    app: "{{ template "elasticsearch.uname" . }}"
    {{- range $key, $value := .Values.labels }}
    {{ $key }}: {{ $value | quote }}
    {{- end }}
type: Opaque
data:
  username: {{ "elastic" | b64enc }}
  {{- if .Values.secret.password }}
  password: {{ .Values.secret.password | b64enc }}
  {{- else }}
  password: {{ $passwordValue }}
  {{- end }}
  {{- if .Values.security.transport.enabled }}
  trans-keystore-cert: {{ .Values.secret.transport.keystore }}
  trans-keystore-passwd: {{ .Values.secret.transport.keystorePassword | b64enc }}
  trans-keystore-keypasswd: {{ .Values.secret.transport.keystoreKeyPassword | b64enc }}
  trans-truststore-cert: {{ .Values.secret.transport.truststore }}
  trans-truststore-passwd: {{ .Values.secret.transport.truststorePassword | b64enc }}
  {{- end }}
{{- end }}

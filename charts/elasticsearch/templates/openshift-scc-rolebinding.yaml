{{- if and (include "common.compatibility.isOpenshift" .) (not (empty .Values.openshiftSccClusterRoleName)) }}
{{- $fullName := include "elasticsearch.uname" . -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $fullName }}-openshift-scc
  namespace: {{ .Release.Namespace | quote }}
  labels:
    heritage: {{ .Release.Service | quote }}
    release: {{ .Release.Name | quote }}
    chart: "{{ .Chart.Name }}-{{ .Chart.Version }}"
    app: {{ $fullName | quote }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Values.openshiftSccClusterRoleName | quote }}
subjects:
  - kind: ServiceAccount
    name: "{{ template "elasticsearch.serviceAccount" . }}"
    namespace: {{ .Release.Namespace | quote }}
{{- end }}
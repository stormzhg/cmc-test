{{- if .Values.machineLearning.enabled }}
{{- $mem := .Values.resources.limits.memory -}}
{{- if (regexMatch "^([0-9]+)Gi$" $mem) -}}
{{- $mem_value := $mem | trimSuffix "Gi" | int -}}
{{- if lt $mem_value 4 }}
{{ fail (printf "memory limit is set to %dGi which must be at least 4Gi when machine learning is enabled" $mem_value) }}
{{- end }}
{{- else }}
{{ fail "memory limit must be set in Gi (e.g. '4Gi')" }}
{{- end }}
{{- end }}

apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ template "elasticsearch.uname" . }}
  labels:
    heritage: {{ .Release.Service | quote }}
    release: {{ .Release.Name | quote }}
    chart: "{{ .Chart.Name }}"
    app: "{{ template "elasticsearch.uname" . }}"
    {{- range $key, $value := .Values.labels }}
    {{ $key }}: {{ $value | quote }}
    {{- end }}
  annotations:
    esMajorVersion: "{{ include "elasticsearch.esMajorVersion" . }}"
spec:
  serviceName: {{ template "elasticsearch.uname" . }}-headless
  selector:
    matchLabels:
      app: "{{ template "elasticsearch.uname" . }}"
  replicas: {{ .Values.replicas.min }}
  podManagementPolicy: {{ .Values.podManagementPolicy }}
  updateStrategy:
    type: {{ .Values.updateStrategy }}
  {{- if .Values.persistence.enabled }}
  volumeClaimTemplates:
  {{- if or (not .Values.nodeLocalStorage.enabled) .Values.nodeLocalStorage.backupRestoreEnabled }}
  {{- /* Create NFS PVC when: node-local disabled (original behavior) OR backup enabled (need NFS for backup) */}}
  - metadata:
      name: {{ template "elasticsearch.uname" . }}
    {{- if .Values.persistence.labels.enabled }}
      labels:
        release: {{ .Release.Name | quote }}
        chart: "{{ .Chart.Name }}"
        app: "{{ template "elasticsearch.uname" . }}"
        {{- range $key, $value := .Values.labels }}
        {{ $key }}: {{ $value | quote }}
        {{- end }}
    {{- end }}
    {{- with .Values.persistence.annotations  }}
      annotations:
{{ toYaml . | indent 8 }}
    {{- end }}
    spec:
{{ toYaml .Values.volumeClaimTemplate | indent 6 }}
  {{- end }}
  {{- if .Values.nodeLocalStorage.enabled }}
  {{- /* Create node-local PVC when node-local storage is enabled */}}
  - metadata:
      name: elasticsearch-data-nodelocalstorage
      labels:
        heritage: {{ .Release.Service | quote }}
        release: {{ .Release.Name | quote }}
        chart: "{{ .Chart.Name }}"
        app: "{{ template "elasticsearch.uname" . }}"
    spec:
      accessModes:
      - ReadWriteOnce
      storageClassName: {{ default "local-path" $.Values.nodeLocalStorage.storageClassName }}
      resources:
        requests:
          storage: {{ .Values.nodeLocalStorage.storageSize }}
  {{- end }}
  {{- end }}
  template:
    metadata:
      name: "{{ template "elasticsearch.uname" . }}"
      labels:
        release: {{ .Release.Name | quote }}
        chart: "{{ .Chart.Name }}"
        app: "{{ template "elasticsearch.uname" . }}"
        {{- range $key, $value := .Values.labels }}
        {{ $key }}: {{ $value | quote }}
        {{- end }}
        {{- if and (.Values.istioEnabled) ( not (.Capabilities.APIVersions.Has "consul.hashicorp.com/v1alpha1")) }}
        sidecar.istio.io/inject: "true"
        {{- end }}
      annotations:
        {{- range $key, $value := .Values.podAnnotations }}
        {{ $key }}: {{ $value | quote }}
        {{- end }}
        {{/* This forces a restart if the configmap has changed */}}
        {{- if or .Values.esConfig .Values.esJvmOptions }}
        configchecksum: {{ include (print .Template.BasePath "/elasticsearch-configmap.yaml") . | sha256sum | trunc 63 }}
        {{- end }}
        {{- if .Capabilities.APIVersions.Has "consul.hashicorp.com/v1alpha1" }}
        consul.hashicorp.com/connect-inject: 'true'
        consul.hashicorp.com/transparent-proxy: 'true'
        consul.hashicorp.com/transparent-proxy-overwrite-probes: 'false'
        {{- end }}
    spec:
      {{- $isOpenshift := include "common.compatibility.isOpenshift" . }}
      {{- $hasOpenshiftSccRole := not (empty .Values.openshiftSccClusterRoleName) }}
      {{- $enableVolumePermissions := and .Values.volumePermissions.enabled (or (not $isOpenshift) $hasOpenshiftSccRole) }}
      {{- if .Values.schedulerName }}
      schedulerName: "{{ .Values.schedulerName }}"
      {{- end }}
      securityContext:  {{- include "common.compatibility.renderSecurityContext" (dict "secContext" .Values.podSecurityContext "context" $) | nindent 8 }}
        {{- if .Values.useSeLinuxOptionTypeSpcT }}
        seLinuxOptions:
          type: spc_t
        {{- end }}
      # CCSR-3172, 2025-12-26, Always use the created ServiceAccount as the consul requires it
      serviceAccountName: "{{ template "elasticsearch.serviceAccount" . }}"
      automountServiceAccountToken: {{ .Values.rbac.automountToken }}
      {{- with .Values.tolerations }}
      tolerations:
{{ toYaml . | indent 6 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
{{ toYaml . | indent 8 }}
      {{- end }}
      {{- if or (eq .Values.antiAffinity "hard") (eq .Values.antiAffinity "soft") .Values.nodeAffinity }}
      {{- if .Values.priorityClassName }}
      priorityClassName: {{ .Values.priorityClassName }}
      {{- end }}
      affinity:
      {{- end }}
      {{- if eq .Values.antiAffinity "hard" }}
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchExpressions:
              - key: app
                operator: In
                values:
                - "{{ template "elasticsearch.uname" .}}"
            topologyKey: {{ .Values.antiAffinityTopologyKey }}
      {{- else if eq .Values.antiAffinity "soft" }}
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              topologyKey: {{ .Values.antiAffinityTopologyKey }}
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - "{{ template "elasticsearch.uname" . }}"
      {{- end }}
      {{- with .Values.nodeAffinity }}
        nodeAffinity:
{{ toYaml . | indent 10 }}
      {{- end }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriod }}
      volumes:
        {{- if .Values.secret.enabled }}
        - name: elastic-credentials
          secret:
            secretName: {{ template "elasticsearch.uname" . }}-credentials
            items:
              - key: password
                path: ELASTIC_PASSWORD
        {{- end }}
        {{- range .Values.secretMounts }}
        - name: {{ .name }}
          secret:
            secretName: {{ template "elasticsearch.uname" $ }}-credentials
            items:
            {{- range .items }}
              - key: {{ .key }}
                path: {{ (base .path) }}
            {{- end }}
        {{- end }}
        {{- if .Values.esConfig }}
        - name: esconfig
          configMap:
            name: {{ template "elasticsearch.uname" . }}-config
        {{- end }}
        {{- if .Values.esJvmOptions }}
        - name: esjvmoptions
          configMap:
            name: {{ template "elasticsearch.uname" . }}-jvm-options
        {{- end }}
        {{- if .Values.createCert }}
        - name: elasticsearch-certs
          secret:
           secretName: {{ template "elasticsearch.uname" . }}-certs
        {{- end }}
{{- if .Values.keystore }}
        - name: keystore
          emptyDir: {}
        {{- range .Values.keystore }}
        - name: keystore-{{ .secretName }}
          secret: {{ toYaml . | nindent 12 }}
        {{- end }}
{{ end }}
      {{- if .Values.extraVolumes }}
      # Currently some extra blocks accept strings
      # to continue with backwards compatibility this is being kept
      # whilst also allowing for yaml to be specified too.
      {{- if eq "string" (printf "%T" .Values.extraVolumes) }}
{{ tpl .Values.extraVolumes . | indent 8 }}
      {{- else }}
{{ toYaml .Values.extraVolumes | indent 8 }}
      {{- end }}
      {{- end }}
      {{- if .Values.imagePullSecrets }}
      imagePullSecrets:
{{ toYaml .Values.imagePullSecrets | indent 8 }}
      {{- end }}
      enableServiceLinks: {{ .Values.enableServiceLinks }}
      {{- if .Values.hostAliases }}
      hostAliases: {{ toYaml .Values.hostAliases | nindent 8 }}
      {{- end }}
      {{- if or (.Values.extraInitContainers) (.Values.sysctlInitContainer.enabled) (.Values.keystore) (.Values.nodeLocalStorage.backupRestoreEnabled) ($enableVolumePermissions) }}
      initContainers:
      {{- if $enableVolumePermissions }}
      - name: volume-permissions
        image: "{{ .Values.image.registry }}/{{ .Values.utilbox.image.repository }}:{{ .Values.utilbox.image.tag }}"
        imagePullPolicy: "{{ .Values.utilbox.image.pullPolicy }}"
        {{- if .Values.volumePermissions.containerSecurityContext.enabled }}
        {{- if and $isOpenshift $hasOpenshiftSccRole }}
        securityContext: {{- omit .Values.volumePermissions.containerSecurityContext "enabled" | toYaml | nindent 10 }}
        {{- else }}
        securityContext: {{- include "common.compatibility.renderSecurityContext" (dict "secContext" .Values.volumePermissions.containerSecurityContext "context" $) | nindent 10 }}
        {{- end }}
        {{- end }}
        command:
          - /bin/bash
        args:
          - -ec
          - |
            mkdir -p /usr/share/elasticsearch/data
            chown -R {{ .Values.podSecurityContext.runAsUser }}:{{ .Values.podSecurityContext.fsGroup }} /usr/share/elasticsearch/data
        {{- if .Values.volumePermissions.resources }}
        resources: {{- toYaml .Values.volumePermissions.resources | nindent 10 }}
        {{- end }}
        volumeMounts:
          {{- if and .Values.persistence.enabled .Values.nodeLocalStorage.enabled }}
          - name: elasticsearch-data-nodelocalstorage
            subPathExpr: {{ $.Release.Name }}/{{ $.Release.Namespace }}/{{ $.Values.clusterName }}/$(POD_NAME)
            mountPath: /usr/share/elasticsearch/data
          {{- else if .Values.persistence.enabled }}
          - name: "{{ template "elasticsearch.uname" . }}"
            mountPath: /usr/share/elasticsearch/data
          {{- end }}
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: metadata.name
      {{- end }}
      {{- if and .Values.persistence.enabled .Values.nodeLocalStorage.enabled .Values.nodeLocalStorage.backupRestoreEnabled }}
      - name: restore-data-from-pv
        securityContext: {{- include "common.compatibility.renderSecurityContext" (dict "secContext" .Values.securityContext "context" $) | nindent 10 }}
        image: "{{ .Values.image.registry }}/{{ .Values.utilbox.image.repository }}:{{ .Values.utilbox.image.tag }}"
        imagePullPolicy: "{{ .Values.utilbox.image.pullPolicy }}"
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: metadata.name
        command:
        - bash
        - -c
        - |
          set -e
          PV_PATH="{{ .Values.nodeLocalStorage.backupPath }}"
          BACKUP_PATH="$PV_PATH/backup"
          DATA_PATH="/usr/share/elasticsearch/data"
          COMPLETE_LOG="$PV_PATH/complete.log"
          RESTORE_LOG="$PV_PATH/restore.log"
          
          # Function to log messages to both stdout and restore.log
          log() {
            local msg="[$(date -Iseconds)] $1"
            echo "$msg"
            echo "$msg" >> "$RESTORE_LOG"
          }
          
          # Initialize restore log
          echo "========================================" >> "$RESTORE_LOG"
          log "Restore process started"
          log "Pod: ${HOSTNAME}"
          log "Backup path: $BACKUP_PATH"
          log "Data path: $DATA_PATH"
          
          # Check if backup data exists in PV
          if [ -d "$BACKUP_PATH" ] && [ "$(ls -A $BACKUP_PATH 2>/dev/null)" ]; then
            # Check for complete.log to verify backup integrity
            if [ ! -f "$COMPLETE_LOG" ]; then
              log "ERROR: Backup data found but complete.log is missing!"
              log "This indicates the previous backup did not complete successfully."
              log "The index data may be corrupted or incomplete."
              log "Manual intervention required: either restore from a known good backup"
              log "or remove the incomplete backup data from PV to start fresh."
              log "Restore process FAILED. Rely on cluster sync."
              exit 0
            fi
            
            log "Found complete.log - backup integrity verified."
            log "Previous backup info:"
            cat "$COMPLETE_LOG" | while read line; do log "  $line"; done
            
            log "Starting data restore to node-local storage..."
            START_TIME=$(date +%s)
            START_TIMESTAMP=$(date -Iseconds)
            
            cp -r "$BACKUP_PATH/." "$DATA_PATH/"
            # Remove the complete.log and restore.log from node-local volume (they should only exist in PV)
            rm -f "$DATA_PATH/complete.log"
            rm -f "$DATA_PATH/restore.log"
            
            END_TIME=$(date +%s)
            END_TIMESTAMP=$(date -Iseconds)
            ELAPSED=$((END_TIME - START_TIME))
            
            log "Data restore completed successfully"
            log "Restore start time: $START_TIMESTAMP"
            log "Restore end time: $END_TIMESTAMP"
            log "Restore duration: ${ELAPSED} seconds"
            log "Restored files:"
            ls -la "$DATA_PATH/" | while read line; do log "  $line"; done
            log "Restore process SUCCEEDED"
          else
            log "No existing data found in PV backup path. Starting fresh."
            mkdir -p "$DATA_PATH"
            log "Created empty data directory: $DATA_PATH"
            log "Restore process SUCCEEDED (fresh start)"
          fi
          echo "========================================" >> "$RESTORE_LOG"
        resources:
{{ toYaml .Values.initResources | indent 10 }}
        volumeMounts:
          - name: elasticsearch-data-nodelocalstorage
            subPathExpr: {{ $.Release.Name }}/{{ $.Release.Namespace }}/{{ $.Values.clusterName }}/$(POD_NAME)
            mountPath: /usr/share/elasticsearch/data
          - name: "{{ template "elasticsearch.uname" . }}"
            mountPath: {{ .Values.nodeLocalStorage.backupPath }}
      {{- end }}
      {{- if .Values.sysctlInitContainer.enabled }}
      - name: configure-sysctl
        securityContext:
          runAsUser: 0
          privileged: true
        image: "{{ .Values.image.registry }}/{{ .Values.utilbox.image.repository }}:{{ .Values.utilbox.image.tag }}"
        imagePullPolicy: "{{ .Values.utilbox.image.pullPolicy }}"
        command: ["sysctl", "-w", "vm.max_map_count={{ .Values.sysctlVmMaxMapCount}}"]
        resources:
{{ toYaml .Values.initResources | indent 10 }}
      {{- end }}
{{ if .Values.keystore }}
      - name: keystore
        securityContext: {{- include "common.compatibility.renderSecurityContext" (dict "secContext" .Values.securityContext "context" $) | nindent 10 }}
        image: "{{ .Values.image.registry }}/{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: "{{ .Values.image.pullPolicy }}"
        command:
        - bash
        - -c
        - |
          set -euo pipefail

          elasticsearch-keystore create

          for i in /tmp/keystoreSecrets/*/*; do
            key=$(basename $i)
            echo "Adding file $i to keystore key $key"
            elasticsearch-keystore add-file "$key" "$i"
          done

          # Add the bootstrap password since otherwise the Elasticsearch entrypoint tries to do this on startup
          if [ -f /usr/share/elasticsearch/config/secret/ELASTIC_PASSWORD ]; then
            echo 'Adding mounted secret ELASTIC_PASSWORD to keystore as key bootstrap.password'
            cat /usr/share/elasticsearch/config/secret/ELASTIC_PASSWORD | elasticsearch-keystore add -x bootstrap.password
          fi

          cp -a /usr/share/elasticsearch/config/elasticsearch.keystore /tmp/keystore/
        env: {{ toYaml .Values.extraEnvs | nindent 10 }}
        envFrom: {{ toYaml .Values.envFrom | nindent 10 }}
        resources: {{ toYaml .Values.initResources | nindent 10 }}
        volumeMounts:
          - name: keystore
            mountPath: /tmp/keystore
          {{- if .Values.secret.enabled }}
          - name: elastic-credentials
            mountPath: /usr/share/elasticsearch/config/secret
            readOnly: true
          {{- end }}
          {{- range .Values.keystore }}
          - name: keystore-{{ .secretName }}
            mountPath: /tmp/keystoreSecrets/{{ .secretName }}
          {{- end }}
{{ end }}
      {{- if .Values.extraInitContainers }}
      # Currently some extra blocks accept strings
      # to continue with backwards compatibility this is being kept
      # whilst also allowing for yaml to be specified too.
      {{- if eq "string" (printf "%T" .Values.extraInitContainers) }}
{{ tpl .Values.extraInitContainers . | indent 6 }}
      {{- else }}
{{ toYaml .Values.extraInitContainers | indent 6 }}
      {{- end }}
      {{- end }}
      {{- end }}
      containers:
      - name: "{{ template "elasticsearch.name" . }}"
        securityContext: {{- include "common.compatibility.renderSecurityContext" (dict "secContext" .Values.securityContext "context" $) | nindent 10 }}
        image: "{{ .Values.image.registry }}/{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: "{{ .Values.image.pullPolicy }}"
        readinessProbe:
          exec:
            command:
              - bash
              - -c
              - |
                set -e

                # Read ELASTIC_PASSWORD from mounted secret file
                ELASTIC_PASSWORD_FILE="/usr/share/elasticsearch/config/secret/ELASTIC_PASSWORD"
                if [ ! -f "${ELASTIC_PASSWORD_FILE}" ]; then
                  echo "ELASTIC_PASSWORD file is missing, exiting"
                  exit 1
                fi
                ELASTIC_PASSWORD=$(cat "${ELASTIC_PASSWORD_FILE}")

                # If the node is starting up wait for the cluster to be ready (request params: "{{ .Values.clusterHealthCheckParams }}" )
                # Once it has started only check that the node itself is responding
                START_FILE=/tmp/.es_start_file

                # Disable nss cache to avoid filling dentry cache when calling curl
                # This is required with Elasticsearch Docker using nss < 3.52
                export NSS_SDB_USE_CACHE=no

                HTTP_HOST="${POD_IP}"
                if [[ "${HTTP_HOST}" == *:* ]]; then
                  HTTP_HOST="[${HTTP_HOST}]"
                fi
                ES_URL="{{ .Values.protocol }}://${HTTP_HOST}:{{ .Values.httpPort }}"

                http () {
                  local path="${1}"
                  local args="${2}"
                  set -- -XGET -s

                  if [ "$args" != "" ]; then
                    set -- "$@" $args
                  fi

                  set -- "$@" -u "elastic:${ELASTIC_PASSWORD}"

                  curl --output /dev/null -k "$@" "${ES_URL}${path}"
                }

                if [ -f "${START_FILE}" ]; then
                  echo 'Elasticsearch is already running, lets check the node is healthy'
                  HTTP_CODE=$(http "/" "-w %{http_code}")
                  RC=$?
                  if [[ ${RC} -ne 0 ]]; then
                    echo "curl --output /dev/null -k -XGET -s -w '%{http_code}' \${BASIC_AUTH} ${ES_URL}/ failed with RC ${RC}"
                    exit ${RC}
                  fi
                  # ready if HTTP code 200, 503 is tolerable if ES version is 6.x
                  if [[ ${HTTP_CODE} == "200" ]]; then
                    exit 0
                  elif [[ ${HTTP_CODE} == "503" && "{{ include "elasticsearch.esMajorVersion" . }}" == "6" ]]; then
                    exit 0
                  else
                    echo "curl --output /dev/null -k -XGET -s -w '%{http_code}' \${BASIC_AUTH} ${ES_URL}/ failed with HTTP code ${HTTP_CODE}"
                    exit 1
                  fi

                else
                  echo 'Waiting for elasticsearch cluster to become ready (request params: "{{ .Values.clusterHealthCheckParams }}" )'
                  if http "/_cluster/health?{{ .Values.clusterHealthCheckParams }}" "--fail" ; then
                    touch ${START_FILE}
                    exit 0
                  else
                    echo 'Cluster is not yet ready (request params: "{{ .Values.clusterHealthCheckParams }}" )'
                    exit 1
                  fi
                fi
{{ toYaml .Values.readinessProbe | indent 10 }}
        ports:
        - name: http
          containerPort: {{ .Values.httpPort }}
        - name: transport
          containerPort: {{ .Values.transportPort }}
        resources:
{{ toYaml .Values.resources | indent 10 }}
        env:
          - name: node.name
            valueFrom:
              fieldRef:
                fieldPath: metadata.name
          - name: POD_IP
            valueFrom:
              fieldRef:
                fieldPath: status.podIP
          {{- if and (has "master" .Values.roles) (not .Values.upgrading) }}
          - name: cluster.initial_master_nodes
            value: "{{ template "elasticsearch.endpoints" . }}"
          {{- end }}
          {{- if gt (len (include "elasticsearch.roles" .)) 0 }}
          - name: node.roles
            value: "{{ template "elasticsearch.roles" . }}"
          {{- end }}
          {{- if gt (int (.Values.replicas.min)) 1 }} 
          {{- if lt (int (include "elasticsearch.esMajorVersion" .)) 7 }}
          - name: discovery.zen.ping.unicast.hosts
            value: "{{ template "elasticsearch.masterService" . }}-headless"
          {{- else }}
          - name: discovery.seed_hosts
            value: "{{ template "elasticsearch.masterService" . }}-headless"
          {{- end }}
          {{- end }}
          - name: cluster.name
            value: "{{ .Values.clusterName }}"
          - name: network.host
            value: "{{ .Values.networkHost }}"
          {{- if .Values.secret.enabled }}
          {{- end }}
          {{- if .Values.esJavaOpts  }}
          - name: ES_JAVA_OPTS
            value: "{{ .Values.esJavaOpts }}"
          {{- end }}
          {{- if .Values.security.enabled }}
          - name: xpack.security.enabled
            value: "true"
          # transport ssl configuration
          {{- if .Values.security.transport.enabled }}
          - name: xpack.security.transport.ssl.enabled
            value: "true"
          - name: xpack.security.transport.ssl.verification_mode
            value: "certificate"
          {{- if eq .Values.secret.transport.type "PKCS12"}}
          - name: xpack.security.transport.ssl.keystore.type
            value: {{ .Values.secret.transport.type }}
          - name: xpack.security.transport.ssl.keystore.path
            value: "/usr/share/elasticsearch/config/certs/trans-keystore-cert.p12"
          - name: xpack.security.transport.ssl.truststore.path
            value: "/usr/share/elasticsearch/config/certs/trans-truststore-cert.p12"
          {{- else }}
          {{- end }}
          #- name: xpack.security.transport.ssl.key
          #  value: "/usr/share/elasticsearch/config/certs/tls.key"
          #- name: xpack.security.transport.ssl.certificate
          #  value: "/usr/share/elasticsearch/config/certs/tls.crt"
          #- name: xpack.security.transport.ssl.certificate_authorities
          #  value: "/usr/share/elasticsearch/config/certs/ca.crt"
          {{- else }}
          - name: xpack.security.transport.ssl.enabled
            value: "false"
          {{- end }}
          # https configuration
          {{- if .Values.security.https.enabled }}
          - name: xpack.security.http.ssl.enabled
            value: "true"
          - name: xpack.security.http.ssl.key
            value: "/usr/share/elasticsearch/config/certs/tls.key"
          - name: xpack.security.http.ssl.certificate
            value: "/usr/share/elasticsearch/config/certs/tls.crt"
          - name: xpack.security.http.ssl.certificate_authorities
            value: "/usr/share/elasticsearch/config/certs/ca.crt"
          {{- else }}
          - name: xpack.security.http.ssl.enabled
            value: "false"
          {{- end }}
          {{- else }}
          - name: xpack.security.enabled
            value: "false"
          {{- end }}
          # machine learning configuration
          {{- if .Values.machineLearning.enabled }}
          - name: xpack.ml.enabled
            value: "true"
          - name: xpack.ml.model_repository
            value: "file:///usr/share/elasticsearch/config/models/"
          {{- end }}
{{- if .Values.extraEnvs }}
{{ toYaml .Values.extraEnvs | indent 10 }}
{{- end }}
{{- if .Values.envFrom }}
        envFrom:
{{ toYaml .Values.envFrom | indent 10 }}
{{- end }}
        volumeMounts:
          {{- if and .Values.persistence.enabled .Values.nodeLocalStorage.enabled }}
          {{- if .Values.nodeLocalStorage.backupRestoreEnabled }}
          {{- /* When backupRestore is enabled, mount node-local PV for ES data and NFS PVC for backup */}}
          - name: elasticsearch-data-nodelocalstorage
            subPathExpr: {{ $.Release.Name }}/{{ $.Release.Namespace }}/{{ $.Values.clusterName }}/$(node.name)
            mountPath: /usr/share/elasticsearch/data
          - name: "{{ template "elasticsearch.uname" . }}"
            mountPath: {{ .Values.nodeLocalStorage.backupPath }}
          {{- else }}
          {{- /* Node-local storage without backup: mount node-local PV for ES data only */}}
          - name: elasticsearch-data-nodelocalstorage
            subPathExpr: {{ $.Release.Name }}/{{ $.Release.Namespace }}/{{ $.Values.clusterName }}/$(node.name)
            mountPath: /usr/share/elasticsearch/data
          {{- end }}
          {{- else if .Values.persistence.enabled }}
          {{- /* Standard persistence: mount PVC directly for ES data */}}
          - name: "{{ template "elasticsearch.uname" . }}"
            mountPath: /usr/share/elasticsearch/data
          {{- end }}
          {{- if .Values.createCert }}
          - name: elasticsearch-certs
            mountPath: /usr/share/elasticsearch/config/certs
            readOnly: true
          {{- end }}
          {{- if .Values.secret.enabled }}
          - name: elastic-credentials
            mountPath: /usr/share/elasticsearch/config/secret
            readOnly: true
          {{- end }}
{{ if .Values.keystore }}
          - name: keystore
            mountPath: /usr/share/elasticsearch/config/elasticsearch.keystore
            subPath: elasticsearch.keystore
{{ end }}
          {{- range .Values.secretMounts }}
          {{- $volumename := .name }} 
          {{- range .items }}
          - name: {{ $volumename }}
            mountPath: {{ .path }}
            subPath: {{ (base .path) }}
            readOnly: true
          {{- end }}
          {{- end }}
          {{- range $path, $config := .Values.esConfig }}
          - name: esconfig
            mountPath: /usr/share/elasticsearch/config/{{ $path }}
            subPath: {{ $path }}
          {{- end -}}
          {{- range $path, $config := .Values.esJvmOptions }}
          - name: esjvmoptions
            mountPath: /usr/share/elasticsearch/config/jvm.options.d/{{ $path }}
            subPath: {{ $path }}
          {{- end -}}
        {{- if .Values.extraVolumeMounts }}
        # Currently some extra blocks accept strings
        # to continue with backwards compatibility this is being kept
        # whilst also allowing for yaml to be specified too.
        {{- if eq "string" (printf "%T" .Values.extraVolumeMounts) }}
{{ tpl .Values.extraVolumeMounts . | indent 10 }}
        {{- else }}
{{ toYaml .Values.extraVolumeMounts | indent 10 }}
        {{- end }}
        {{- end }}
{{- if or .Values.lifecycle .Values.nodeLocalStorage.backupRestoreEnabled }}
        lifecycle:
{{- if and .Values.persistence.enabled .Values.nodeLocalStorage.backupRestoreEnabled }}
          preStop:
            exec:
              command:
              - bash
              - -c
              - |
                set -e
                PV_PATH="{{ .Values.nodeLocalStorage.backupPath }}"
                BACKUP_PATH="$PV_PATH/backup"
                DATA_PATH="/usr/share/elasticsearch/data"
                COMPLETE_LOG="$PV_PATH/complete.log"
                PRESTOP_LOG="$PV_PATH/stop.log"
                HTTP_HOST="${POD_IP}"
                if [[ "${HTTP_HOST}" == *:* ]]; then
                  HTTP_HOST="[${HTTP_HOST}]"
                fi
                ES_URL="{{ .Values.protocol }}://${HTTP_HOST}:{{ .Values.httpPort }}"
                
                # Function to log messages to both stdout and restore.log
                log() {
                  local msg="[$(date -Iseconds)] $1"
                  echo "$msg"
                  echo "$msg" >> "$PRESTOP_LOG"
                }

                # Initialize stop log
                echo "========================================" >> "$PRESTOP_LOG"
                log "Starting data backup from node-local storage to PV before shutdown..."
                log "Data path: $DATA_PATH"
                log "Backup path: $BACKUP_PATH"
                
                # Flush Elasticsearch indices to disk before backup
                log "Flushing Elasticsearch indices to disk..."
                {{- if .Values.secret.enabled }}
                FLUSH_RESPONSE=$(curl -s -k -u "elastic:$(cat /usr/share/elasticsearch/config/secret/ELASTIC_PASSWORD)" -X POST "${ES_URL}/_flush" 2>&1) || true
                {{- else }}
                FLUSH_RESPONSE=$(curl -s -k -X POST "${ES_URL}/_flush" 2>&1) || true
                {{- end }}
                log "Flush response: $FLUSH_RESPONSE"
                
                # Small delay to ensure all writes are flushed to disk
                sleep 2
                
                # Ensure backup directory exists
                rm -rf "$BACKUP_PATH"
                mkdir -p "$BACKUP_PATH"
                
                # Remove any existing complete.log to indicate backup in progress
                rm -f "$COMPLETE_LOG"
                
                # Clear old backup and copy current data
                if [ -d "$DATA_PATH" ] && [ "$(ls -A $DATA_PATH 2>/dev/null)" ]; then
                  log "Syncing data to PV backup..."
                  START_TIME=$(date +%s)
                  START_TIMESTAMP=$(date -Iseconds)
                  
                  if cp -a "${DATA_PATH}/." "${BACKUP_PATH}/"; then
                      END_TIME=$(date +%s)
                      END_TIMESTAMP=$(date -Iseconds)
                      ELAPSED=$((END_TIME - START_TIME))

                      # Write complete.log with timing information
                      log "Writing complete.log"
                      echo "Backup completed successfully" > "$COMPLETE_LOG"
                      echo "Start time: $START_TIMESTAMP" >> "$COMPLETE_LOG"
                      echo "End time: $END_TIMESTAMP" >> "$COMPLETE_LOG"
                      echo "Duration: ${ELAPSED} seconds" >> "$COMPLETE_LOG"
                      echo "Pod: ${HOSTNAME}" >> "$COMPLETE_LOG"
                      
                      log "Data backup completed successfully in ${ELAPSED} seconds."
                      log "Complete log written to $COMPLETE_LOG"
                  else
                      ERROR_CODE=$?
                      log "ERROR: Data backup failed with exit code ${ERROR_CODE}."
                      echo "Copy failure detected at $(date -Iseconds)" >&2
                      # Exit with success code
                      exit 0
                  fi
                else
                  log "No data found in node-local storage to backup."
                fi

{{- end }}
{{- if .Values.lifecycle }}
{{ toYaml .Values.lifecycle | indent 10 }}
{{- end }}
{{- end }}
      {{- if .Values.extraContainers }}
      # Currently some extra blocks accept strings
      # to continue with backwards compatibility this is being kept
      # whilst also allowing for yaml to be specified too.
      {{- if eq "string" (printf "%T" .Values.extraContainers) }}
{{ tpl .Values.extraContainers . | indent 6 }}
      {{- else }}
{{ toYaml .Values.extraContainers | indent 6 }}
      {{- end }}
      {{- end }}

{{- if .Values.tests.enabled -}}
---
apiVersion: v1
kind: Pod
metadata:
{{- if .Values.healthNameOverride }}
  name: {{ .Values.healthNameOverride | quote }}
{{- else }}
  name: "{{ .Release.Name }}-{{ randAlpha 5 | lower }}-test"
{{- end }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": hook-succeeded
spec:
  securityContext:
{{ toYaml .Values.podSecurityContext | indent 4 }}
  containers:
{{- if .Values.healthNameOverride }}
  - name: {{ .Values.healthNameOverride | quote }}
{{- else }}
  - name: "{{ .Release.Name }}-{{ randAlpha 5 | lower }}-test"
{{- end }}
    env: []
    image: "{{ .Values.image }}:{{ .Values.imageTag }}"
    imagePullPolicy: "{{ .Values.imagePullPolicy }}"
    command:
      - "sh"
      - "-c"
      - |
        #!/usr/bin/env bash -e
        ELASTIC_PASSWORD=$(cat /usr/share/elasticsearch/config/secret/ELASTIC_PASSWORD)
        curl -XGET --fail --cacert /usr/share/elasticsearch/config/certs/tls.crt -u "elastic:${ELASTIC_PASSWORD}" https://'{{ template "elasticsearch.uname" . }}:{{ .Values.httpPort }}/_cluster/health?{{ .Values.clusterHealthCheckParams }}'
    volumeMounts:
      - name: elasticsearch-certs
        mountPath: /usr/share/elasticsearch/config/certs
        readOnly: true
      - name: elastic-credentials
        mountPath: /usr/share/elasticsearch/config/secret
        readOnly: true
  {{- if .Values.imagePullSecrets }}
  imagePullSecrets:
{{ toYaml .Values.imagePullSecrets | indent 4 }}
  {{- end }}
  restartPolicy: Never
  volumes:
    - name: elasticsearch-certs
      secret:
        secretName: {{ template "elasticsearch.uname" . }}-certs
    - name: elastic-credentials
      secret:
        secretName: {{ template "elasticsearch.uname" . }}-credentials
        items:
          - key: password
            path: ELASTIC_PASSWORD
{{- end -}}

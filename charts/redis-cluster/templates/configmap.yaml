apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "common.names.fullname" . }}-default
  namespace: {{ include "common.names.namespace" . | quote }}
  labels: {{- include "common.labels.standard" ( dict "customLabels" .Values.commonLabels "context" $ ) | nindent 4 }}
  {{- if .Values.commonAnnotations }}
  annotations: {{- include "common.tplvalues.render" ( dict "value" .Values.commonAnnotations "context" $ ) | nindent 4 }}
  {{- end }}
data:
{{- if .Values.redis.defaultConfigOverride }}
  redis-default.conf: |-
    {{- include "common.tplvalues.render" (dict "value" .Values.redis.defaultConfigOverride "context" $) | nindent 4 }}
{{- else }}
  redis-default.conf: |-
    bind 0.0.0.0 ::
    pidfile /opt/redis/tmp/redis_6379.pid
    repl-diskless-sync yes
    cluster-enabled yes
    cluster-config-file /redis/data/nodes.conf
    aclfile /redis/data/aclfile.acl
    dir /redis/data
    appendonly yes
    appendfilename "appendonly.aof"
    appendfsync everysec
    auto-aof-rewrite-percentage 100
    auto-aof-rewrite-min-size 64mb
    save 900 1
    save 300 10
    save 60 10000
{{- end }}
{{- if .Values.redis.configmap }}
{{- include "common.tplvalues.render" (dict "value" .Values.redis.configmap "context" $) | nindent 4 }}
{{- end }}

{{- if and (include "common.compatibility.isOpenshift" .) (not (empty .Values.global.openshiftSccClusterRoleName)) }}
apiVersion: {{ include "common.capabilities.rbac.apiVersion" . }}
kind: RoleBinding
metadata:
  name: {{ include "common.names.fullname" . }}-openshift-scc
  namespace: {{ include "common.names.namespace" . | quote }}
  {{- if .Values.commonAnnotations }}
  annotations: {{- include "common.tplvalues.render" ( dict "value" .Values.commonAnnotations "context" $ ) | nindent 4 }}
  {{- end }}
  labels: {{- include "common.labels.standard" ( dict "customLabels" .Values.commonLabels "context" $ ) | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Values.global.openshiftSccClusterRoleName | quote }}
subjects:
  - kind: ServiceAccount
    name: {{ include "redis-cluster.serviceAccountName" . }}
    namespace: {{ include "common.names.namespace" . | quote }}
{{- end }}
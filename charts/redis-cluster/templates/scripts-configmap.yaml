apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "common.names.fullname" . }}-scripts
  namespace: {{ include "common.names.namespace" . | quote }}
  labels: {{- include "common.labels.standard" ( dict "customLabels" .Values.commonLabels "context" $ ) | nindent 4 }}
  {{- if .Values.commonAnnotations }}
  annotations: {{- include "common.tplvalues.render" ( dict "value" .Values.commonAnnotations "context" $ ) | nindent 4 }}
  {{- end }}
data:
  ping_readiness_local.sh: |-
    #!/bin/bash
    set -e

    REDIS_STATUS_FILE=/tmp/.redis_cluster_check

    {{- if .Values.usePassword }}
    export REDISCLI_AUTH={{ ternary "`cat $REDIS_PASSWORD_FILE`" "$REDIS_PASSWORD" .Values.usePasswordFiles }}
    {{- end }}
    response=$(
      timeout -s 15 $1 \
      redis-cli \
        -h localhost \
{{- if .Values.tls.enabled }}
        -p $REDIS_TLS_PORT_NUMBER \
        --tls \
        --cert {{ template "redis-cluster.tlsCert" . }} \
        --key {{ template "redis-cluster.tlsCertKey" . }} \
        --cacert {{ template "redis-cluster.tlsCACert" . }} \
{{- else }}
        -p $REDIS_PORT_NUMBER \
{{- end }}
        ping
    )
    if [ "$?" -eq "124" ]; then
      echo "Timed out"
      exit 1
    fi
    if [ "$response" != "PONG" ]; then
      echo "$response"
      exit 1
    fi
{{- if not .Values.cluster.externalAccess.enabled }}
    if [ ! -f "$REDIS_STATUS_FILE" ]; then
      response=$(
        timeout -s 15 $1 \
        redis-cli \
          -h localhost \
  {{- if .Values.tls.enabled }}
          -p $REDIS_TLS_PORT_NUMBER \
          --tls \
          --cert {{ template "redis-cluster.tlsCert" . }} \
          --key {{ template "redis-cluster.tlsCertKey" . }} \
          --cacert {{ template "redis-cluster.tlsCACert" . }} \
  {{- else }}
          -p $REDIS_PORT_NUMBER \
  {{- end }}
          CLUSTER INFO | grep cluster_state | tr -d '[:space:]'
      )
      if [ "$?" -eq "124" ]; then
        echo "Timed out"
        exit 1
      fi
      if [ "$response" != "cluster_state:ok" ]; then
        echo "$response"
        exit 1
      else
        touch "$REDIS_STATUS_FILE"
      fi
    fi
{{- end }}
  ping_liveness_local.sh: |-
    #!/bin/bash
    set -e

    {{- if .Values.usePassword }}
    export REDISCLI_AUTH={{ ternary "`cat $REDIS_PASSWORD_FILE`" "$REDIS_PASSWORD" .Values.usePasswordFiles }}
    {{- end }}
    response=$(
      timeout -s 15 $1 \
      redis-cli \
        -h localhost \
{{- if .Values.tls.enabled }}
        -p $REDIS_TLS_PORT_NUMBER \
        --tls \
        --cert {{ template "redis-cluster.tlsCert" . }} \
        --key {{ template "redis-cluster.tlsCertKey" . }} \
        --cacert {{ template "redis-cluster.tlsCACert" . }} \
{{- else }}
        -p $REDIS_PORT_NUMBER \
{{- end }}
        ping
    )
    if [ "$?" -eq "124" ]; then
      echo "Timed out"
      exit 1
    fi
    responseFirstWord=$(echo $response | head -n1 | awk '{print $1;}')
    if [ "$response" != "PONG" ] && [ "$responseFirstWord" != "LOADING" ] && [ "$responseFirstWord" != "MASTERDOWN" ]; then
      echo "$response"
      exit 1
    fi
  pre_stop_hook.sh: |-
    #!/bin/bash
    set -e

    {{- if .Values.usePassword }}
    export REDISCLI_AUTH={{ ternary "`cat $REDIS_PASSWORD_FILE`" "$REDIS_PASSWORD" .Values.usePasswordFiles }}
    {{- end }}

    TIMEOUT=10

    redis_cli_local() {
      timeout -s 15 "$TIMEOUT" \
        redis-cli \
          -h localhost \
{{- if .Values.tls.enabled }}
          -p "$REDIS_TLS_PORT_NUMBER" \
          --tls \
          --cert {{ template "redis-cluster.tlsCert" . }} \
          --key {{ template "redis-cluster.tlsCertKey" . }} \
          --cacert {{ template "redis-cluster.tlsCACert" . }} \
{{- else }}
          -p "$REDIS_PORT_NUMBER" \
{{- end }}
          "$@"
    }

    redis_cli_remote() {
      local host="$1"
      local port="$2"
      shift 2

      timeout -s 15 "$TIMEOUT" \
        redis-cli \
          -h "$host" \
          -p "$port" \
{{- if .Values.tls.enabled }}
          --tls \
          --cert {{ template "redis-cluster.tlsCert" . }} \
          --key {{ template "redis-cluster.tlsCertKey" . }} \
          --cacert {{ template "redis-cluster.tlsCACert" . }} \
{{- end }}
          "$@"
    }

    redis_cli_local CLUSTER SAVECONFIG || echo "Warning: CLUSTER SAVECONFIG failed before termination"

    role=$(
      redis_cli_local ROLE | head -n1
    )

    echo "Current node role: $role"

    if [ "$role" = "slave" ] || [ "$role" = "replica" ]; then
      echo "Node is replica, no action needed"
      exit 0
    fi

    if [ "$role" = "master" ]; then
      echo "Node is master, initiating failover"

      my_id=$(
        redis_cli_local CLUSTER MYID
      )

      replica=$(
        redis_cli_local CLUSTER REPLICAS "$my_id" | head -n1 | awk '{print $2}'
      )

      if [ -z "$replica" ]; then
        echo "Warning: No replica found, cannot perform failover"
        exit 0
      fi

      replica_host=$(echo "$replica" | cut -d':' -f1)
      replica_port=$(echo "$replica" | cut -d':' -f2 | cut -d'@' -f1)

      echo "Triggering failover on first replica: $replica_host:$replica_port"

      redis_cli_remote "$replica_host" "$replica_port" CLUSTER FAILOVER || echo "Warning: CLUSTER FAILOVER failed before termination"

      sleep 3

      redis_cli_local CLUSTER SAVECONFIG || echo "Warning: CLUSTER SAVECONFIG failed after failover"

      echo "Failover initiated successfully"
    fi

    exit 0